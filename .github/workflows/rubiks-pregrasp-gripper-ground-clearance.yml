name: Rubik pregrasp passive gripper ground clearance

on:
  pull_request:
    paths:
      - "bin/observe_rubiks_gripper_states.py"
      - "bin/run_gazebo_pregrasp_gripper_ground_audit"
      - "bin/bind_rubiks_pregrasp_gripper_states.py"
      - "bin/summarize_rubiks_pregrasp_gripper_ground_clearance.py"
      - "bin/observe_rubiks_ground_frames.py"
      - "bin/run_gazebo_pregrasp_ground_plane_audit"
      - "bin/bind_rubiks_pregrasp_ground_frames.py"
      - "bin/summarize_rubiks_pregrasp_ground_plane_clearance.py"
      - "bin/run_gazebo_pregrasp_simulation_state"
      - "bin/run_rubiks_pregrasp_simulation_state.py"
      - "project/rubiks_self_collision_ws/**"
      - "project/resource/turtlebot3_lime.urdf.xacro"
      - "project/resource/turtlebot3_lime_arm_motion_test.urdf.xacro"
      - "project/resource/gazebo_arm_motion_test_controller_manager.yaml"
      - "project/resource/rubiks_grasp_calibration.world"
      - "doc/rubiks_pregrasp_gripper_ground_clearance.md"
      - "Dockerfile"
      - ".github/workflows/rubiks-pregrasp-gripper-ground-clearance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubiks-pregrasp-passive-gripper-ground-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  measured-passive-gripper-ground-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}

      - name: Validate exact checkout and passive-observation boundary
        run: |
          test "$(git rev-parse HEAD)" = "${EXACT_HEAD_SHA}"
          python3 -m py_compile \
            bin/observe_rubiks_gripper_states.py \
            bin/bind_rubiks_pregrasp_gripper_states.py \
            bin/summarize_rubiks_pregrasp_gripper_ground_clearance.py \
            bin/observe_rubiks_ground_frames.py \
            bin/bind_rubiks_pregrasp_ground_frames.py \
            bin/summarize_rubiks_pregrasp_ground_plane_clearance.py \
            bin/run_rubiks_pregrasp_simulation_state.py
          bash -n bin/run_gazebo_pregrasp_gripper_ground_audit
          bash -n bin/run_gazebo_pregrasp_ground_plane_audit
          bash -n bin/run_gazebo_pregrasp_simulation_state
          python3 - <<'PY'
          from pathlib import Path

          observer = Path('bin/observe_rubiks_gripper_states.py').read_text(encoding='utf-8')
          wrapper = Path('bin/run_gazebo_pregrasp_gripper_ground_audit').read_text(encoding='utf-8')
          binder = Path('bin/bind_rubiks_pregrasp_gripper_states.py').read_text(encoding='utf-8')
          summary = Path('bin/summarize_rubiks_pregrasp_gripper_ground_clearance.py').read_text(encoding='utf-8')
          checker = Path('project/rubiks_self_collision_ws/src/rubiks_self_collision_preflight/src/rubiks_gripper_ground_clearance_preflight.cpp').read_text(encoding='utf-8')

          for required in (
              'create_subscription', 'JointState', 'gripper_left_joint',
              'gripper_right_joint', 'read_only_subscription_only',
          ):
              if required not in observer:
                  raise SystemExit(f'passive observer lacks required evidence: {required}')
          for forbidden in ('create_publisher', 'create_client', 'ActionClient', 'send_goal', 'publish('):
              if forbidden in observer:
                  raise SystemExit(f'passive observer contains an active path: {forbidden}')
          for required in (
              'run_gazebo_pregrasp_ground_plane_audit',
              'observe_rubiks_gripper_states.py',
              'GRIPPER_OBSERVER_PID', 'read_only_subscription_only',
          ):
              if required not in wrapper:
                  raise SystemExit(f'wrapper lacks required passive boundary: {required}')
          for required in (
              'MAX_ARM_MATCH_ERROR_RAD = 1e-9',
              'MAX_MIMIC_POSITION_RESIDUAL_M = 1e-6',
              'MAX_MIMIC_VELOCITY_RESIDUAL_M_S = 1e-5',
              'simulation_moveit_joint_contract_exact_match',
              'simulation_moveit_collision_geometry_exact_match',
              'gripper_controller_loaded', 'gripper_command_sent',
          ):
              if required not in binder:
                  raise SystemExit(f'passive-state binder lacks required gate: {required}')
          for required in (
              'setVariablePosition("gripper_left_joint"',
              'getVariablePosition("gripper_right_joint"',
              'checkSelfCollision', 'checkCollision', 'shapes::Plane',
              'gripper_left_link', 'gripper_right_link',
              'ground_request.distance = false',
          ):
              if required not in checker:
                  raise SystemExit(f'MoveIt checker lacks required operation: {required}')
          for forbidden in ('rclcpp::Node', 'ActionClient', 'MoveGroupInterface', 'create_publisher'):
              if forbidden in checker:
                  raise SystemExit(f'MoveIt checker contains an active runtime path: {forbidden}')
          for required in (
              'continuous_between_samples_claimed', 'object_clearance_claimed',
              'contact_or_force_claimed', 'actuation_capability_claimed',
              'new_actuation_path_added',
          ):
              if required not in summary:
                  raise SystemExit(f'summary lacks claim boundary: {required}')
          PY

      - name: Build exact-head Lime image
        run: docker build -t lime-tidyup-pregrasp-passive-gripper:${EXACT_HEAD_SHA} .

      - name: Run unchanged arm trial and passive gripper audit
        run: |
          mkdir -p artifacts
          docker run --rm \
            -e ROS_DOMAIN_ID=36 \
            -e SOURCE_REF="${EXACT_HEAD_SHA}" \
            -v "$PWD/artifacts:/artifacts" \
            lime-tidyup-pregrasp-passive-gripper:${EXACT_HEAD_SHA} \
            bash -lc '
              set -eo pipefail
              source /opt/ros/humble/setup.bash
              source /project/lib_ws/install/setup.bash
              source /root/turtlebot3_ws/install/setup.bash

              bash /root/bin/run_gazebo_pregrasp_gripper_ground_audit \
                /artifacts "${SOURCE_REF}"

              moveit_share="$(ros2 pkg prefix --share turtlebot3_lime_moveit_config)"
              cp "${moveit_share}/config/turtlebot3_lime.srdf" \
                /artifacts/turtlebot3_lime.srdf

              python3 /root/bin/bind_rubiks_pregrasp_ground_frames.py \
                --simulation-summary /artifacts/rubiks_pregrasp_simulation_state_summary.json \
                --ground-frame-trace /artifacts/rubiks_pregrasp_ground_frame_trace.json \
                --simulation-urdf /artifacts/turtlebot3_lime_arm_motion_test.urdf \
                --moveit-urdf /artifacts/turtlebot3_lime_pregrasp_search.urdf \
                --world /project/resource/rubiks_grasp_calibration.world \
                --base-runner /root/bin/run_gazebo_pregrasp_simulation_state \
                --states-tsv /artifacts/rubiks_pregrasp_ground_plane_states.tsv \
                --output /artifacts/rubiks_pregrasp_ground_frame_binding.json \
                --source-ref "${SOURCE_REF}"

              colcon build \
                --merge-install \
                --base-paths /project/rubiks_self_collision_ws/src \
                --build-base /tmp/rubiks_passive_gripper_build \
                --install-base /tmp/rubiks_passive_gripper_install \
                --cmake-args -DCMAKE_BUILD_TYPE=Release \
                --event-handlers console_direct+
              source /tmp/rubiks_passive_gripper_install/setup.bash

              /tmp/rubiks_passive_gripper_install/lib/rubiks_self_collision_preflight/rubiks_ground_plane_clearance_preflight \
                /artifacts/turtlebot3_lime_pregrasp_search.urdf \
                /artifacts/turtlebot3_lime.srdf \
                /artifacts/rubiks_pregrasp_ground_plane_states.tsv \
                /artifacts/rubiks_pregrasp_ground_plane_collision_results.tsv

              python3 /root/bin/summarize_rubiks_pregrasp_ground_plane_clearance.py \
                --simulation-summary /artifacts/rubiks_pregrasp_simulation_state_summary.json \
                --ground-frame-trace /artifacts/rubiks_pregrasp_ground_frame_trace.json \
                --frame-binding /artifacts/rubiks_pregrasp_ground_frame_binding.json \
                --states-tsv /artifacts/rubiks_pregrasp_ground_plane_states.tsv \
                --collision-results /artifacts/rubiks_pregrasp_ground_plane_collision_results.tsv \
                --simulation-urdf /artifacts/turtlebot3_lime_arm_motion_test.urdf \
                --moveit-urdf /artifacts/turtlebot3_lime_pregrasp_search.urdf \
                --srdf /artifacts/turtlebot3_lime.srdf \
                --world /project/resource/rubiks_grasp_calibration.world \
                --base-runner /root/bin/run_gazebo_pregrasp_simulation_state \
                --output /artifacts/rubiks_pregrasp_ground_plane_clearance_summary.json \
                --manifest /artifacts/rubiks_pregrasp_ground_plane_clearance_evidence.manifest.json \
                --source-ref "${SOURCE_REF}"

              python3 /root/bin/bind_rubiks_pregrasp_gripper_states.py \
                --simulation-summary /artifacts/rubiks_pregrasp_simulation_state_summary.json \
                --gripper-trace /artifacts/rubiks_pregrasp_gripper_state_trace.json \
                --ground-states /artifacts/rubiks_pregrasp_ground_plane_states.tsv \
                --simulation-urdf /artifacts/turtlebot3_lime_arm_motion_test.urdf \
                --moveit-urdf /artifacts/turtlebot3_lime_pregrasp_search.urdf \
                --output-states /artifacts/rubiks_pregrasp_gripper_ground_states.tsv \
                --output /artifacts/rubiks_pregrasp_gripper_state_binding.json \
                --source-ref "${SOURCE_REF}"

              /tmp/rubiks_passive_gripper_install/lib/rubiks_self_collision_preflight/rubiks_gripper_ground_clearance_preflight \
                /artifacts/turtlebot3_lime_pregrasp_search.urdf \
                /artifacts/turtlebot3_lime.srdf \
                /artifacts/rubiks_pregrasp_gripper_ground_states.tsv \
                /artifacts/rubiks_pregrasp_gripper_ground_collision_results.tsv

              python3 /root/bin/summarize_rubiks_pregrasp_gripper_ground_clearance.py \
                --simulation-summary /artifacts/rubiks_pregrasp_simulation_state_summary.json \
                --ground-summary /artifacts/rubiks_pregrasp_ground_plane_clearance_summary.json \
                --ground-manifest /artifacts/rubiks_pregrasp_ground_plane_clearance_evidence.manifest.json \
                --state-trace /artifacts/rubiks_pregrasp_gripper_state_trace.json \
                --state-binding /artifacts/rubiks_pregrasp_gripper_state_binding.json \
                --states-tsv /artifacts/rubiks_pregrasp_gripper_ground_states.tsv \
                --collision-results /artifacts/rubiks_pregrasp_gripper_ground_collision_results.tsv \
                --simulation-urdf /artifacts/turtlebot3_lime_arm_motion_test.urdf \
                --moveit-urdf /artifacts/turtlebot3_lime_pregrasp_search.urdf \
                --srdf /artifacts/turtlebot3_lime.srdf \
                --world /project/resource/rubiks_grasp_calibration.world \
                --controllers-before /artifacts/pregrasp_controllers_before.txt \
                --controllers-after /artifacts/pregrasp_controllers_after.txt \
                --output /artifacts/rubiks_pregrasp_gripper_ground_clearance_summary.json \
                --manifest /artifacts/rubiks_pregrasp_gripper_ground_clearance_evidence.manifest.json \
                --source-ref "${SOURCE_REF}"
            ' >artifacts/passive_gripper_ground.stdout.log \
              2>artifacts/passive_gripper_ground.stderr.log

      - name: Validate exact-head passive gripper evidence
        run: |
          test -s artifacts/rubiks_pregrasp_gripper_ground_clearance_summary.json
          test -s artifacts/rubiks_pregrasp_gripper_ground_clearance_evidence.manifest.json
          python3 - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          root = Path('artifacts')
          expected_head = os.environ['EXACT_HEAD_SHA']
          summary = json.loads((root / 'rubiks_pregrasp_gripper_ground_clearance_summary.json').read_text())
          manifest = json.loads((root / 'rubiks_pregrasp_gripper_ground_clearance_evidence.manifest.json').read_text())

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          require(summary.get('passed') is True, summary.get('errors'))
          require(summary.get('errors') == [], 'passive gripper audit contains errors')
          require(summary.get('source_ref') == expected_head, 'summary source mismatch')
          require(summary.get('exact_head_bound') is True, 'summary exact-head flag missing')
          require(summary.get('upstream_arm_floor_audit_passed') is True, 'upstream arm-floor audit failed')

          binding = summary.get('passive_state_binding', {})
          measured = binding.get('measured_state_evidence', {})
          require(binding.get('passed') is True, 'passive-state binding failed')
          require(binding.get('state_count', 0) >= 100, 'bound state count too low')
          require(binding.get('simulation_moveit_joint_contract_exact_match') is True, 'joint contract mismatch')
          require(binding.get('simulation_moveit_collision_geometry_exact_match') is True, 'finger geometry mismatch')
          require(measured.get('all_samples_matched') is True, 'not all samples matched')
          require(measured.get('matched_sample_count') == binding.get('state_count'), 'matched state count mismatch')
          require(measured.get('maximum_arm_match_error_rad', math.inf) <= 1e-9, 'arm sample match error')
          require(measured.get('missing_velocity_count') == 0, 'finger velocity evidence missing')
          require(measured.get('maximum_mimic_position_residual_m', math.inf) <= 1e-6, 'measured mimic position mismatch')
          require(measured.get('maximum_mimic_velocity_residual_m_s', math.inf) <= 1e-5, 'measured mimic velocity mismatch')

          collision = summary.get('moveit_passive_finger_floor_audit', {})
          require(collision.get('state_count') == binding.get('state_count'), 'MoveIt state count mismatch')
          require(collision.get('robot_name') == 'turtlebot3_lime', 'MoveIt model mismatch')
          require(collision.get('root_link') == 'base_footprint', 'MoveIt root mismatch')
          require(collision.get('arm_joint_order') == [f'joint{i}' for i in range(1, 7)], 'arm order mismatch')
          require(collision.get('finger_joint_order') == ['gripper_left_joint', 'gripper_right_joint'], 'finger order mismatch')
          require(collision.get('audited_links') == ['gripper_left_link', 'gripper_right_link'], 'audited link set mismatch')
          require(collision.get('missing_geometry') == [], 'finger collision geometry missing')
          require(collision.get('all_bounds_ok') is True, 'MoveIt bounds failure')
          require(collision.get('all_model_mimic_matches') is True, 'MoveIt mimic mismatch')
          require(collision.get('maximum_model_mimic_residual_m', math.inf) <= 1e-9, 'MoveIt mimic residual exceeded')
          require(collision.get('all_self_collision_free') is True, 'self collision detected')
          require(collision.get('all_audited_links_floor_clear') is True, 'finger-floor collision detected')
          require(collision.get('maximum_floor_pair_count') == 0, 'floor contacts reported')
          require(collision.get('maximum_self_pair_count') == 0, 'self contacts reported')
          require(collision.get('floor_pairs') == [], 'floor pair set is nonempty')
          require(collision.get('self_pairs') == [], 'self pair set is nonempty')

          limits = summary.get('claim_limits', {})
          require(limits.get('sampled_states_only') is True, 'sample-only boundary missing')
          for key in (
              'continuous_between_samples_claimed', 'object_clearance_claimed',
              'contact_or_force_claimed', 'actuation_capability_claimed',
              'hardware_readiness_claimed',
          ):
              require(limits.get(key) is False, f'{key} must remain false')
          safety = summary.get('safety', {})
          require(safety.get('same_two_arm_goals_only') is True, 'two-goal boundary missing')
          require(safety.get('passive_observer_only') is True, 'passive observation boundary missing')
          require(safety.get('offline_floor_object_only') is True, 'offline floor boundary missing')
          for key in (
              'finger_actuator_loaded', 'finger_actuation_performed',
              'new_actuation_path_added', 'object_spawned',
              'base_actuation_performed', 'lift_performed', 'attachment_used',
              'physical_hardware_used', 'production_runtime_modified',
          ):
              require(safety.get(key) is False, f'{key} must remain false')

          require(manifest.get('source_ref') == expected_head, 'manifest source mismatch')
          require(manifest.get('exact_head_bound') is True, 'manifest exact-head flag missing')
          require(manifest.get('all_states_passed') is True, 'manifest records failed states')
          require(manifest.get('state_count') == binding.get('state_count'), 'manifest state count mismatch')
          require(manifest.get('moveit_checked_state_count') == binding.get('state_count'), 'manifest MoveIt count mismatch')
          require(len(manifest.get('inputs', {})) == 13, 'manifest input coverage mismatch')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload passive gripper evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubiks-pregrasp-passive-gripper-ground-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
