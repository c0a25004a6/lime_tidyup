name: Rubik Gazebo gripper command evidence

on:
  push:
    paths:
      - "bin/run_gripper_command_smoke.py"
      - "bin/run_gazebo_gripper_command_evidence"
      - "bin/render_gripper_command_video.py"
      - "project/resource/turtlebot3_lime_gripper_test.urdf.xacro"
      - "project/resource/gazebo_gripper_test_controller_manager.yaml"
      - "project/resource/rubiks_grasp_calibration.world"
      - "doc/rubiks_gazebo_gripper_command_evidence.md"
      - ".github/workflows/rubiks-gazebo-gripper-command-evidence.yml"
  pull_request:
    paths:
      - "bin/run_gripper_command_smoke.py"
      - "bin/run_gazebo_gripper_command_evidence"
      - "bin/render_gripper_command_video.py"
      - "project/resource/turtlebot3_lime_gripper_test.urdf.xacro"
      - "project/resource/gazebo_gripper_test_controller_manager.yaml"
      - "project/resource/rubiks_grasp_calibration.world"
      - "doc/rubiks_gazebo_gripper_command_evidence.md"
      - ".github/workflows/rubiks-gazebo-gripper-command-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubiks-gazebo-gripper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gazebo-gripper-command-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Validate test-only harness
        run: |
          python3 -m py_compile \
            bin/run_gripper_command_smoke.py \
            bin/render_gripper_command_video.py
          bash -n bin/run_gazebo_gripper_command_evidence
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('project/resource/turtlebot3_lime_gripper_test.urdf.xacro')
          ET.parse('project/resource/rubiks_grasp_calibration.world')
          PY
          grep -q 'libgazebo_ros2_control.so' project/resource/turtlebot3_lime_gripper_test.urdf.xacro
          ! grep -q 'libgazebo_grasp_fix.so\|librealsense_gazebo_plugin.so\|libgazebo_ros_diff_drive.so\|libgazebo_ros_ray_sensor.so' \
            project/resource/turtlebot3_lime_gripper_test.urdf.xacro

      - name: Install video encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Build current Lime simulation image
        run: docker build -t lime-tidyup-gazebo-gripper:${{ github.sha }} .

      - name: Run no-contact Gazebo gripper trial
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run --rm --network host \
            -v "$PWD/artifacts:/artifacts" \
            lime-tidyup-gazebo-gripper:${{ github.sha }} \
            bash -lc 'bash /root/bin/run_gazebo_gripper_command_evidence /artifacts' \
            >artifacts/container.stdout.log 2>artifacts/container.stderr.log

      - name: Validate Gazebo command telemetry
        run: |
          test -s artifacts/turtlebot3_lime_gripper_test.urdf
          test -s artifacts/gazebo_gripper_command_telemetry.json
          test -s artifacts/gazebo_gripper_command_summary.json
          test -s artifacts/gazebo_gripper_command_evidence.manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('artifacts/gazebo_gripper_command_summary.json').read_text())
          if summary.get('passed') is not True:
              raise SystemExit(summary.get('errors'))
          if summary.get('hardware_backend') != 'gazebo_ros2_control':
              raise SystemExit('unexpected hardware backend')
          if summary.get('event_labels') != ['open_1', 'close', 'open_2']:
              raise SystemExit('unexpected command sequence')
          if summary.get('right_joint_observed_all_samples') is not True:
              raise SystemExit('right mimic joint was not continuously observed')
          if not 0.020 <= float(summary['link_frame_separation_min_m']) <= 0.024:
              raise SystemExit(f"unexpected closed separation: {summary['link_frame_separation_min_m']}")
          if not 0.078 <= float(summary['link_frame_separation_max_m']) <= 0.082:
              raise SystemExit(f"unexpected open separation: {summary['link_frame_separation_max_m']}")
          if float(summary['robot_base_displacement_m']) > 0.05:
              raise SystemExit('robot moved too far during no-contact test')
          if float(summary['robot_final_linear_speed_m_s']) > 0.05:
              raise SystemExit('robot was not settled at the end')
          for key in ('cube_spawned', 'cube_contact', 'inner_face_opening_calibrated', 'grasp_success_claimed'):
              if summary.get(key) is not False:
                  raise SystemExit(f'{key} must remain false')
          if summary.get('sensor_plugins_present') is not False:
              raise SystemExit('sensor plugins must be absent from the test harness')
          if summary.get('grasp_fix_present') is not False:
              raise SystemExit('grasp-fix must be absent from this gate')
          print(json.dumps(summary, indent=2))
          PY

      - name: Render Gazebo joint-state evidence video
        run: |
          python3 bin/render_gripper_command_video.py \
            --telemetry artifacts/gazebo_gripper_command_telemetry.json \
            --output artifacts/gazebo_gripper_command_telemetry_evidence.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of json artifacts/gazebo_gripper_command_telemetry_evidence.mp4 \
            >artifacts/gazebo_gripper_command_telemetry_evidence.ffprobe.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          probe = json.loads(Path('artifacts/gazebo_gripper_command_telemetry_evidence.ffprobe.json').read_text())
          duration = float(probe['format']['duration'])
          size = int(probe['format']['size'])
          if duration < 4.0:
              raise SystemExit(f'video too short: {duration}')
          if size < 10000:
              raise SystemExit(f'video unexpectedly small: {size}')
          print(f'video duration={duration:.3f}s size={size}')
          PY

      - name: Upload Gazebo gripper command evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubiks-gazebo-gripper-command-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
