name: Rubik Gazebo gauge calibration evidence

on:
  push:
    paths:
      - "bin/run_gripper_gauge_calibration.py"
      - "bin/run_gazebo_gripper_gauge_calibration"
      - "bin/render_gripper_command_video.py"
      - "project/resource/rubiks_static_gauge_057.sdf"
      - "project/resource/turtlebot3_lime_gripper_test.urdf.xacro"
      - "project/resource/gazebo_gripper_test_controller_manager.yaml"
      - "project/resource/rubiks_grasp_calibration.world"
      - "doc/rubiks_gazebo_gauge_calibration.md"
      - ".github/workflows/rubiks-gazebo-gauge-calibration.yml"
  pull_request:
    paths:
      - "bin/run_gripper_gauge_calibration.py"
      - "bin/run_gazebo_gripper_gauge_calibration"
      - "bin/render_gripper_command_video.py"
      - "project/resource/rubiks_static_gauge_057.sdf"
      - "project/resource/turtlebot3_lime_gripper_test.urdf.xacro"
      - "project/resource/gazebo_gripper_test_controller_manager.yaml"
      - "project/resource/rubiks_grasp_calibration.world"
      - "doc/rubiks_gazebo_gauge_calibration.md"
      - ".github/workflows/rubiks-gazebo-gauge-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubiks-gazebo-gauge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gazebo-gauge-calibration-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Validate calibration harness
        run: |
          python3 -m py_compile \
            bin/run_gripper_gauge_calibration.py \
            bin/render_gripper_command_video.py
          bash -n bin/run_gazebo_gripper_gauge_calibration
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('project/resource/rubiks_static_gauge_057.sdf')
          ET.parse('project/resource/turtlebot3_lime_gripper_test.urdf.xacro')
          ET.parse('project/resource/rubiks_grasp_calibration.world')
          PY
          grep -q '0.012 0.057 0.020' project/resource/rubiks_static_gauge_057.sdf
          grep -q 'libgazebo_ros_bumper.so' project/resource/rubiks_static_gauge_057.sdf
          ! grep -q 'libgazebo_grasp_fix.so' project/resource/turtlebot3_lime_gripper_test.urdf.xacro

      - name: Install video encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Build current Lime simulation image
        run: docker build -t lime-tidyup-gauge-calibration:${{ github.sha }} .

      - name: Run static-gauge calibration trial
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp project/resource/rubiks_static_gauge_057.sdf artifacts/
          docker run --rm --network host \
            -v "$PWD/artifacts:/artifacts" \
            lime-tidyup-gauge-calibration:${{ github.sha }} \
            bash -lc 'bash /root/bin/run_gazebo_gripper_gauge_calibration /artifacts' \
            >artifacts/container.stdout.log 2>artifacts/container.stderr.log

      - name: Validate static-gauge evidence
        run: |
          test -s artifacts/turtlebot3_lime_gripper_test.urdf
          test -s artifacts/rubiks_static_gauge_057.sdf
          test -s artifacts/gazebo_gauge_calibration_telemetry.json
          test -s artifacts/gazebo_gauge_calibration_summary.json
          test -s artifacts/gazebo_gauge_calibration_evidence.manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('artifacts/gazebo_gauge_calibration_summary.json').read_text())
          if summary.get('passed') is not True:
              raise SystemExit(summary.get('errors'))
          if summary.get('inner_face_opening_calibrated') is not True:
              raise SystemExit('inner-face calibration was not accepted')
          if summary.get('dual_gauge_contact_observed') is not True:
              raise SystemExit('both physical fingers must contact the gauge')
          if summary.get('initial_open_contact') is not False:
              raise SystemExit('the gauge intersected the fully open gripper')
          if summary.get('contact_cleared_after_reopen') is not True:
              raise SystemExit('contact did not clear after reopening')
          calibration = summary['calibration']
          offset = float(calibration['combined_inner_face_offset_m'])
          if not 0.001 <= offset <= 0.010:
              raise SystemExit(f'implausible combined offset: {offset}')
          open_width = float(calibration['predicted_open_inner_face_opening_m'])
          closed_width = float(calibration['predicted_closed_inner_face_opening_m'])
          if not 0.070 <= open_width <= 0.080:
              raise SystemExit(f'unexpected calibrated full-open width: {open_width}')
          if not 0.010 <= closed_width <= 0.022:
              raise SystemExit(f'unexpected calibrated full-closed width: {closed_width}')
          if float(calibration['estimated_uncertainty_m']) > 0.003:
              raise SystemExit('calibration uncertainty exceeds 3 mm')
          for key in ('cube_spawned', 'cube_contact', 'ifra_attachment_used', 'grasp_success_claimed'):
              if summary.get(key) is not False:
                  raise SystemExit(f'{key} must remain false')
          print(json.dumps(summary, indent=2))
          PY

      - name: Render calibration telemetry video
        run: |
          python3 bin/render_gripper_command_video.py \
            --telemetry artifacts/gazebo_gauge_calibration_telemetry.json \
            --output artifacts/gazebo_gauge_calibration_telemetry_evidence.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of json artifacts/gazebo_gauge_calibration_telemetry_evidence.mp4 \
            >artifacts/gazebo_gauge_calibration_telemetry_evidence.ffprobe.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          probe = json.loads(Path('artifacts/gazebo_gauge_calibration_telemetry_evidence.ffprobe.json').read_text())
          duration = float(probe['format']['duration'])
          size = int(probe['format']['size'])
          if duration < 4.0:
              raise SystemExit(f'video too short: {duration}')
          if size < 10000:
              raise SystemExit(f'video unexpectedly small: {size}')
          print(f'video duration={duration:.3f}s size={size}')
          PY

      - name: Upload static-gauge calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubiks-gazebo-gauge-calibration-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
