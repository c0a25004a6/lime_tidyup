name: Rubik grasp-relevance constrained fixture search

on:
  pull_request:
    paths:
      - "bin/prepare_rubiks_pregrasp_grasp_relevance_constrained_search.py"
      - "bin/summarize_rubiks_pregrasp_grasp_relevance_constrained_search.py"
      - "project/rubiks_self_collision_ws/**"
      - "doc/rubiks_pregrasp_grasp_relevance_constrained_fixture_search.md"
      - "Dockerfile"
      - ".github/workflows/rubiks-pregrasp-grasp-relevance-constrained-fixture-search.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rubiks-grasp-relevance-constrained-search-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deterministic-constrained-search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ACCEPTED_ARTIFACT_ID: "8899235338"
      ACCEPTED_ARTIFACT_SHA256: 07ab22da2516b46182871e95a6324fc4325d806999e73bd80954811dac963e65
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}

      - name: Validate exact checkout and constrained-search boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_HEAD_SHA}"
          python3 -m py_compile \
            bin/prepare_rubiks_pregrasp_grasp_relevance_constrained_search.py \
            bin/summarize_rubiks_pregrasp_grasp_relevance_constrained_search.py
          python3 - <<'PY'
          from pathlib import Path

          prepare = Path('bin/prepare_rubiks_pregrasp_grasp_relevance_constrained_search.py').read_text()
          summary = Path('bin/summarize_rubiks_pregrasp_grasp_relevance_constrained_search.py').read_text()
          checker = Path('project/rubiks_self_collision_ws/src/rubiks_self_collision_preflight/src/rubiks_grasp_relevance_constrained_fixture_search_preflight.cpp').read_text()
          source = Path('project/rubiks_self_collision_ws/src/rubiks_self_collision_preflight/src/rubiks_fixture_alignment_search_preflight_v2.cpp').read_text()
          cmake = Path('project/rubiks_self_collision_ws/src/rubiks_self_collision_preflight/CMakeLists.txt').read_text()

          for text, label in ((prepare, 'prepare'), (summary, 'summary'), (checker, 'checker')):
              for forbidden in (
                  'rclpy', 'rclcpp::Node', 'ActionClient', 'create_publisher',
                  'create_client', 'MoveGroupInterface', 'FollowJointTrajectory',
                  'GripperCommand', 'spawn_entity',
              ):
                  if forbidden in text:
                      raise SystemExit(f'{label} contains runtime path: {forbidden}')
          for required in (
              'PR24_SOURCE', 'EXPECTED_FILES', 'EXPECTED_RELEVANT_COARSE_COUNT = 61511',
              'positive_cube_finger_aabb_overlap_x_and_z',
              'common_mimic_side_plane_interval_within_limits',
              'collision_rules_weakened',
          ):
              if required not in prepare:
                  raise SystemExit(f'prepare lacks input/filter contract: {required}')
          for required in (
              '#include "rubiks_fixture_alignment_search_preflight_v2.cpp"',
              'evaluate_reach', 'evaluate_translation', 'check_single_object',
              'EXPECTED_COARSE_RELEVANT = 61511',
              'FULL_PATH_CLEAR_GRASP_RELEVANT_TRANSLATION_FOUND',
              'NO_FULL_PATH_CLEAR_GRASP_RELEVANT_TRANSLATION_WITHIN_COARSE_RADIUS',
              'baseline did not reproduce accepted fixture blocker',
              'PR24 grasp-relevance blocker was not reproduced',
          ):
              if required not in checker:
                  raise SystemExit(f'checker lacks constrained operation: {required}')
          for required in (
              'check_single_object', 'scene.checkCollision',
              'prepare_states', 'scene.checkSelfCollision',
              'coarse_candidates', 'fine_candidates',
          ):
              if required not in source:
                  raise SystemExit(f'included accepted search helper lacks: {required}')
          for required in (
              'EXPECTED_COARSE_RELEVANT = 61511',
              'nearest_clear_relevant_candidate_on_coarse_grid_then_local_fine_grid_only',
              'continuous_global_optimum_claimed', 'rotation_search_performed',
              'exact_mesh_surface_contact_claimed', 'gripper_motion_clearance_claimed',
              'grasp_success_claimed',
          ):
              if required not in summary:
                  raise SystemExit(f'summary lacks claim boundary: {required}')
          if 'rubiks_grasp_relevance_constrained_fixture_search_preflight' not in cmake:
              raise SystemExit('constrained search target is not installed')
          PY

      - name: Download accepted PR24 relevance evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/accepted
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ACCEPTED_ARTIFACT_ID}/zip" \
            -o artifacts/accepted.zip
          printf '%s  %s\n' "${ACCEPTED_ARTIFACT_SHA256}" artifacts/accepted.zip | sha256sum --check --strict
          unzip -q artifacts/accepted.zip -d artifacts/accepted

      - name: Build exact-head Lime image
        run: docker build -t lime-tidyup-grasp-relevance-search:${EXACT_HEAD_SHA} .

      - name: Run deterministic grasp-relevance constrained search
        run: |
          docker run --rm \
            -e SOURCE_REF="${EXACT_HEAD_SHA}" \
            -v "$PWD/artifacts:/artifacts" \
            lime-tidyup-grasp-relevance-search:${EXACT_HEAD_SHA} \
            bash -lc '
              set -eo pipefail
              source /opt/ros/humble/setup.bash
              source /project/lib_ws/install/setup.bash
              source /root/turtlebot3_ws/install/setup.bash

              python3 /root/bin/prepare_rubiks_pregrasp_grasp_relevance_constrained_search.py \
                --accepted-dir /artifacts/accepted \
                --contract-tsv /artifacts/rubiks_pregrasp_grasp_relevance_constrained_search_contract.tsv \
                --output /artifacts/rubiks_pregrasp_grasp_relevance_constrained_search_input_binding.json \
                --source-ref "${SOURCE_REF}"

              colcon build \
                --merge-install \
                --base-paths /project/rubiks_self_collision_ws/src \
                --build-base /tmp/rubiks_grasp_relevance_search_build \
                --install-base /tmp/rubiks_grasp_relevance_search_install \
                --cmake-args -DCMAKE_BUILD_TYPE=Release \
                --event-handlers console_direct+
              source /tmp/rubiks_grasp_relevance_search_install/setup.bash

              /tmp/rubiks_grasp_relevance_search_install/lib/rubiks_self_collision_preflight/rubiks_grasp_relevance_constrained_fixture_search_preflight \
                /artifacts/accepted/accepted/accepted/turtlebot3_lime_fixture_current.urdf \
                /artifacts/accepted/accepted/accepted/turtlebot3_lime_fixture_current.srdf \
                /artifacts/accepted/accepted/accepted/pregrasp/rubiks_pregrasp_gripper_ground_states.tsv \
                /artifacts/accepted/accepted/accepted/rubiks_pregrasp_fixture_contract.tsv \
                /artifacts/rubiks_pregrasp_grasp_relevance_constrained_search_contract.tsv \
                /artifacts/rubiks_pregrasp_grasp_relevance_constrained_search_results.tsv

              python3 /root/bin/summarize_rubiks_pregrasp_grasp_relevance_constrained_search.py \
                --binding /artifacts/rubiks_pregrasp_grasp_relevance_constrained_search_input_binding.json \
                --contract /artifacts/rubiks_pregrasp_grasp_relevance_constrained_search_contract.tsv \
                --results /artifacts/rubiks_pregrasp_grasp_relevance_constrained_search_results.tsv \
                --urdf /artifacts/accepted/accepted/accepted/turtlebot3_lime_fixture_current.urdf \
                --srdf /artifacts/accepted/accepted/accepted/turtlebot3_lime_fixture_current.srdf \
                --states /artifacts/accepted/accepted/accepted/pregrasp/rubiks_pregrasp_gripper_ground_states.tsv \
                --fixture /artifacts/accepted/accepted/accepted/rubiks_pregrasp_fixture_contract.tsv \
                --output /artifacts/rubiks_pregrasp_grasp_relevance_constrained_search_summary.json \
                --manifest /artifacts/rubiks_pregrasp_grasp_relevance_constrained_search_evidence.manifest.json \
                --source-ref "${SOURCE_REF}"
            ' >artifacts/grasp_relevance_constrained_search.stdout.log \
              2>artifacts/grasp_relevance_constrained_search.stderr.log

      - name: Validate exact-head constrained-search evidence
        run: |
          set -euo pipefail
          test -s artifacts/rubiks_pregrasp_grasp_relevance_constrained_search_summary.json
          test -s artifacts/rubiks_pregrasp_grasp_relevance_constrained_search_evidence.manifest.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('artifacts')
          summary = json.loads((root / 'rubiks_pregrasp_grasp_relevance_constrained_search_summary.json').read_text())
          manifest = json.loads((root / 'rubiks_pregrasp_grasp_relevance_constrained_search_evidence.manifest.json').read_text())

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          require(summary.get('audit_passed') is True and summary.get('errors') == [], 'constrained search audit failed')
          require(summary.get('source_ref') == os.environ['EXACT_HEAD_SHA'], 'summary source mismatch')
          require(summary.get('exact_head_bound') is True, 'exact-head flag missing')
          decision = summary.get('decision')
          require(decision in (
              'FULL_PATH_CLEAR_GRASP_RELEVANT_TRANSLATION_FOUND',
              'NO_FULL_PATH_CLEAR_GRASP_RELEVANT_TRANSLATION_WITHIN_COARSE_RADIUS',
          ), 'unexpected constrained search decision')
          found = summary.get('correction_candidate_found') is True
          require((decision == 'FULL_PATH_CLEAR_GRASP_RELEVANT_TRANSLATION_FOUND') is found, 'decision/found mismatch')

          baseline = summary.get('baseline_reproduction', {})
          require(baseline.get('clear') is False, 'baseline unexpectedly clear')
          require(baseline.get('first_collision_state_index') == 0, 'baseline index mismatch')
          require(baseline.get('cube_collision') is True and baseline.get('support_collision') is True, 'baseline classes mismatch')

          hard_filter = summary.get('hard_filter', {})
          coarse_filter = hard_filter.get('coarse', {})
          require(coarse_filter.get('total_candidates') == 267761, 'coarse total mismatch')
          require(coarse_filter.get('relevant_candidates') == 61511, 'coarse relevant mismatch')
          require(coarse_filter.get('filtered_candidates') == 206250, 'coarse filtered mismatch')
          require(coarse_filter.get('minimum_relevant_z_step') == -40, 'coarse min Z mismatch')
          require(coarse_filter.get('maximum_relevant_z_step') == 22, 'coarse max Z mismatch')
          require(hard_filter.get('collision_rules_weakened') is False, 'collision rules weakened')

          coarse = summary.get('coarse_search', {})
          require(coarse.get('candidate_count') == 61511, 'coarse search candidate mismatch')
          if found:
              selected = summary.get('selected_candidate', {})
              require(selected.get('full_recorded_path_clear') is True, 'selected path not clear')
              require(selected.get('cube_support_relative_transform_preserved') is True, 'fixture relation changed')
              reach = selected.get('reach', {})
              require(reach.get('relevant') is True and reach.get('common_interval_exists') is True, 'selected reach invalid')
              for key in ('left_x_overlap_m', 'left_z_overlap_m', 'right_x_overlap_m', 'right_z_overlap_m'):
                  require(reach.get(key, 0.0) > 0.0, f'selected overlap missing: {key}')
              audit = summary.get('selected_path_audit', {})
              require(audit.get('state_count') == 2802, 'selected state count mismatch')
              require(audit.get('all_bounds_ok') is True, 'selected bounds failure')
              require(audit.get('all_self_collision_free') is True, 'selected self collision')
              require(audit.get('all_cube_clear') is True, 'selected cube collision')
              require(audit.get('all_support_clear') is True, 'selected support collision')
              require(audit.get('contact_pair_count') == 0, 'selected fixture contacts')
          else:
              require(coarse.get('candidates_checked') == 61511, 'negative search incomplete')
              require(summary.get('selected_path_audit', {}).get('state_count') == 0, 'negative search emitted states')

          limits = summary.get('claim_limits', {})
          require(limits.get('nearest_clear_relevant_candidate_on_coarse_grid_then_local_fine_grid_only') is True, 'grid claim missing')
          for key in (
              'continuous_global_optimum_claimed', 'rotation_search_performed',
              'exact_mesh_surface_contact_claimed', 'force_closure_claimed',
              'friction_claimed', 'gripper_motion_clearance_claimed',
              'grasp_success_claimed', 'lifting_or_transport_claimed',
              'hardware_readiness_claimed',
          ):
              require(limits.get(key) is False, f'{key} must remain false')

          safety = summary.get('safety', {})
          require(safety.get('offline_analysis_only') is True, 'offline boundary missing')
          require(safety.get('cube_support_rigid_relation_preserved') is True, 'rigid relation boundary missing')
          for key in (
              'gazebo_started', 'ros_node_created', 'object_spawned',
              'controller_loaded', 'planning_request_created',
              'trajectory_instantiated', 'command_sent', 'attachment_used',
              'physical_hardware_used', 'production_runtime_modified',
          ):
              require(safety.get(key) is False, f'{key} must remain false')

          require(manifest.get('source_ref') == os.environ['EXACT_HEAD_SHA'], 'manifest source mismatch')
          require(manifest.get('decision') == decision, 'manifest decision mismatch')
          require(manifest.get('correction_candidate_found') is found, 'manifest found mismatch')
          require(manifest.get('coarse_total_candidate_count') == 267761, 'manifest coarse total mismatch')
          require(manifest.get('coarse_relevant_candidate_count') == 61511, 'manifest relevant count mismatch')
          require(len(manifest.get('inputs', {})) == 7, 'manifest input coverage mismatch')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload constrained-search evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubiks-pregrasp-grasp-relevance-constrained-fixture-search-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
