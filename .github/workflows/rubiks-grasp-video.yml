name: Rubik grasp video evidence

on:
  push:
    paths:
      - "bin/run_rubiks_cube_settle_video"
      - "bin/record_rubiks_model_states.py"
      - "bin/render_rubiks_trajectory_video.py"
      - "project/resource/rubiks_grasp_calibration.world"
      - "project/resource/model_editor_models/rubiks_cube/**"
      - ".github/workflows/rubiks-grasp-video.yml"
  pull_request:
    paths:
      - "bin/run_rubiks_cube_settle_video"
      - "bin/record_rubiks_model_states.py"
      - "bin/render_rubiks_trajectory_video.py"
      - "project/resource/rubiks_grasp_calibration.world"
      - "project/resource/model_editor_models/rubiks_cube/**"
      - ".github/workflows/rubiks-grasp-video.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate evidence harness
        run: |
          python3 -m py_compile \
            bin/rubiks_grasp_preflight.py \
            bin/record_rubiks_model_states.py \
            bin/render_rubiks_trajectory_video.py
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('project/resource/rubiks_grasp_calibration.world')
          PY
          bash -n bin/run_rubiks_cube_settle_video
      - name: Install video encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build current Lime simulation image
        run: docker build -t lime-tidyup-rubiks-video:${{ github.sha }} .
      - name: Run headless Gazebo settle trial
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run --rm --network host \
            -v "$PWD/artifacts:/artifacts" \
            lime-tidyup-rubiks-video:${{ github.sha }} \
            bash -lc 'bash /root/bin/run_rubiks_cube_settle_video /artifacts' \
            >artifacts/container.log 2>&1
      - name: Validate physics telemetry
        run: |
          set -euo pipefail
          test -s artifacts/rubiks_cube_trajectory.json
          test -s artifacts/rubiks_cube_settle.manifest.json
          test -s artifacts/rubiks_cube_model_validation.json
          grep -q 'rubiks_cube_settle' artifacts/rubiks_cube_model_states_final.yaml
          python3 - <<'PY'
          import json
          import math
          from pathlib import Path

          trajectory = json.loads(Path('artifacts/rubiks_cube_trajectory.json').read_text())
          parameters = json.loads(Path('project/resource/model_editor_models/rubiks_cube/parameters.json').read_text())
          manifest = json.loads(Path('artifacts/rubiks_cube_settle.manifest.json').read_text())
          samples = trajectory['samples']
          edge = float(parameters['model']['edge_length_m'])
          expected_final_z = edge / 2

          if trajectory['sample_count'] < 50:
              raise SystemExit(f"too few telemetry samples: {trajectory['sample_count']}")
          first_z = float(samples[0]['position_m'][2])
          final_z = float(samples[-1]['position_m'][2])
          fall = first_z - final_z
          final_speed = math.sqrt(sum(float(v) ** 2 for v in samples[-1]['linear_velocity_m_s']))
          duration = float(samples[-1]['t_s'])

          if first_z < 0.25:
              raise SystemExit(f'initial cube height was not captured: {first_z}')
          if fall < 0.20:
              raise SystemExit(f'insufficient observed fall: {fall}')
          if abs(final_z - expected_final_z) > 0.0025:
              raise SystemExit(
                  f'final z outside settle tolerance: actual={final_z} expected={expected_final_z}'
              )
          if final_speed > 0.02:
              raise SystemExit(f'cube did not settle: final speed={final_speed}')
          if duration < 8.0:
              raise SystemExit(f'telemetry duration too short: {duration}')
          if manifest.get('automatic_grasp_success') is not False:
              raise SystemExit('settle evidence must not declare grasp success')
          if manifest.get('gripper_motion_performed') is not False:
              raise SystemExit('first evidence gate must not move the gripper')
          if manifest.get('raw_gazebo_gui_video') is not False:
              raise SystemExit('artifact must identify itself as telemetry-rendered')

          summary = {
              'sample_count': trajectory['sample_count'],
              'duration_s': duration,
              'first_z_m': first_z,
              'final_z_m': final_z,
              'observed_fall_m': fall,
              'expected_final_z_m': expected_final_z,
              'final_linear_speed_m_s': final_speed,
              'physics_gate_passed': True,
          }
          Path('artifacts/rubiks_cube_settle.physics_summary.json').write_text(
              json.dumps(summary, indent=2) + '\n'
          )
          print(json.dumps(summary, indent=2))
          PY
      - name: Render telemetry evidence video
        run: |
          set -euo pipefail
          python3 bin/render_rubiks_trajectory_video.py \
            --trajectory artifacts/rubiks_cube_trajectory.json \
            --parameters project/resource/model_editor_models/rubiks_cube/parameters.json \
            --output artifacts/rubiks_cube_settle_telemetry_evidence.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of json artifacts/rubiks_cube_settle_telemetry_evidence.mp4 \
            >artifacts/rubiks_cube_settle_telemetry_evidence.ffprobe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          probe = json.loads(Path('artifacts/rubiks_cube_settle_telemetry_evidence.ffprobe.json').read_text())
          duration = float(probe['format']['duration'])
          size = int(probe['format']['size'])
          if duration < 8.0:
              raise SystemExit(f'video too short: {duration}')
          if size < 10000:
              raise SystemExit(f'video unexpectedly small: {size}')
          print(f'video duration={duration:.2f}s size={size}')
          PY
      - name: Upload video and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubiks-cube-settle-video-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
