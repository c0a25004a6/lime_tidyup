name: Provenance dev2 rewrite preview

on:
  push:
    branches:
      - audit/provenance-dev2-rewrite

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audit branch with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Build and verify dev2 provenance rewrite preview
        shell: bash
        env:
          OLD_DEV2: 66c20a90a2f0a1652716f53df886ac9603fbebb1
          OLD_ROOT: 5252d3a1fd2c5d987a414772f2caf010964b4380
          FLAT_COPY: 161ea8a30baa559cce2f48a415427996eec0ff37
          BASELINE: 737274733d018596cef24e5d9f9c7c6e4834159d
        run: |
          set -Eeuo pipefail

          git remote remove canonical 2>/dev/null || true
          git remote add canonical https://github.com/momoiorg-repository/LimeSimulDemo.git
          git fetch --no-tags canonical main
          git fetch origin dev2

          test "$(git rev-parse origin/dev2)" = "$OLD_DEV2"
          test "$(git rev-list --max-parents=0 "$OLD_DEV2")" = "$OLD_ROOT"
          git merge-base --is-ancestor "$OLD_ROOT" "$FLAT_COPY"
          git merge-base --is-ancestor "$FLAT_COPY" "$OLD_DEV2"
          git merge-base --is-ancestor "$BASELINE" canonical/main
          test "$(git rev-parse "$OLD_ROOT:README.md")" = "$(git rev-parse "$BASELINE:README.md")"
          test "$(git show -s --format=%at "$BASELINE")" -lt "$(git show -s --format=%at "$OLD_ROOT")"

          echo '=== source boundary ==='
          echo "old_dev2=$OLD_DEV2"
          echo "old_root=$OLD_ROOT"
          echo "flat_copy=$FLAT_COPY"
          echo "baseline=$BASELINE"
          git show -s --format='baseline_author=%an <%ae>%nbaseline_date=%aI%nbaseline_subject=%s%nbaseline_tree=%T' "$BASELINE"
          echo "old_root_date=$(git show -s --format=%aI "$OLD_ROOT")"
          echo "root_readme_blob=$(git rev-parse "$OLD_ROOT:README.md")"
          echo "baseline_readme_blob=$(git rev-parse "$BASELINE:README.md")"
          echo "local_commit_count=$((1 + $(git rev-list --count "$OLD_ROOT..$OLD_DEV2")))"
          echo "merge_commits=$(git rev-list --count --merges "$OLD_ROOT..$OLD_DEV2")"
          echo

          echo '=== bootstrap delta from canonical baseline ==='
          git diff --stat "$BASELINE" "$OLD_ROOT"
          echo
          echo '=== flattened-copy commit delta ==='
          git show --stat --oneline "$FLAT_COPY"
          echo

          python3 - "$OLD_ROOT" "$OLD_DEV2" "$BASELINE" <<'PY'
          import os
          import subprocess
          import sys

          old_root, old_head, baseline = sys.argv[1:]

          def text(*args):
              return subprocess.check_output(['git', *args], text=True).rstrip('\n')

          def raw_commit(commit):
              return subprocess.check_output(['git', 'cat-file', 'commit', commit])

          def message(commit):
              return raw_commit(commit).split(b'\n\n', 1)[1]

          def parents(commit):
              p = text('show', '-s', '--format=%P', commit)
              return p.split() if p else []

          def recreate(commit, new_parents):
              env = os.environ.copy()
              env.update({
                  'GIT_AUTHOR_NAME': text('show','-s','--format=%an',commit),
                  'GIT_AUTHOR_EMAIL': text('show','-s','--format=%ae',commit),
                  'GIT_AUTHOR_DATE': text('show','-s','--format=%aI',commit),
                  'GIT_COMMITTER_NAME': text('show','-s','--format=%cn',commit),
                  'GIT_COMMITTER_EMAIL': text('show','-s','--format=%ce',commit),
                  'GIT_COMMITTER_DATE': text('show','-s','--format=%cI',commit),
              })
              cmd = ['git','commit-tree',text('show','-s','--format=%T',commit)]
              for p in new_parents:
                  cmd += ['-p', p]
              return subprocess.check_output(cmd, input=message(commit), env=env).decode().strip()

          mapping = {}
          new_root = recreate(old_root, [baseline])
          mapping[old_root] = new_root

          ordered = text('rev-list','--reverse','--topo-order',f'{old_root}..{old_head}').splitlines()
          for commit in ordered:
              old_parents = parents(commit)
              missing = [p for p in old_parents if p not in mapping]
              if missing:
                  raise SystemExit(f'unmapped parent(s) for {commit}: {missing}')
              mapping[commit] = recreate(commit, [mapping[p] for p in old_parents])

          new_head = mapping[old_head]
          print('=== old -> new mapping ===')
          for old in [old_root] + ordered:
              print(f'{old}\t{mapping[old]}')
          print(f'mapping_count={len(mapping)}')
          print(f'new_root={new_root}')
          print(f'new_head={new_head}')
          with open('/tmp/new_root','w') as f: f.write(new_root)
          with open('/tmp/new_head','w') as f: f.write(new_head)
          with open('/tmp/mapping.tsv','w') as f:
              for old in [old_root] + ordered:
                  f.write(f'{old}\t{mapping[old]}\n')
          PY

          NEW_ROOT="$(cat /tmp/new_root)"
          NEW_HEAD="$(cat /tmp/new_head)"

          echo
          echo '=== candidate gates ==='
          echo "new_root=$NEW_ROOT"
          echo "new_head=$NEW_HEAD"
          echo "old_tree=$(git show -s --format=%T "$OLD_DEV2")"
          echo "new_tree=$(git show -s --format=%T "$NEW_HEAD")"

          test "$(git show -s --format=%T "$OLD_DEV2")" = "$(git show -s --format=%T "$NEW_HEAD")"
          git diff --exit-code "$OLD_DEV2" "$NEW_HEAD"
          git merge-base --is-ancestor "$BASELINE" "$NEW_HEAD"
          if git merge-base --is-ancestor "$OLD_ROOT" "$NEW_HEAD"; then
            echo 'old standalone root unexpectedly remains an ancestor' >&2
            exit 1
          fi
          test "$(wc -l </tmp/mapping.tsv)" -eq "$((1 + $(git rev-list --count "$OLD_ROOT..$OLD_DEV2")))"

          python3 - /tmp/mapping.tsv <<'PY'
          import subprocess
          import sys

          mapping_path = sys.argv[1]

          def raw(commit):
              return subprocess.check_output(['git','cat-file','commit',commit])

          def parse(commit):
              header, message = raw(commit).split(b'\n\n', 1)
              lines = header.splitlines()
              tree = next(x.split(b' ', 1)[1] for x in lines if x.startswith(b'tree '))
              parents = [x.split(b' ', 1)[1] for x in lines if x.startswith(b'parent ')]
              author = next(x for x in lines if x.startswith(b'author '))
              committer = next(x for x in lines if x.startswith(b'committer '))
              return tree, parents, author, committer, message

          count = 0
          with open(mapping_path, encoding='utf-8') as f:
              for line in f:
                  old, new = line.rstrip('\n').split('\t')
                  otree, oparents, oauthor, ocommitter, omsg = parse(old)
                  ntree, nparents, nauthor, ncommitter, nmsg = parse(new)
                  if otree != ntree:
                      raise SystemExit(f'tree mismatch: {old} -> {new}')
                  if oauthor != nauthor:
                      raise SystemExit(f'author header mismatch: {old} -> {new}')
                  if ocommitter != ncommitter:
                      raise SystemExit(f'committer header mismatch: {old} -> {new}')
                  if omsg != nmsg:
                      raise SystemExit(f'message mismatch: {old} -> {new}')
                  if len(oparents) != len(nparents):
                      raise SystemExit(f'parent-count mismatch: {old} -> {new}')
                  count += 1
          print(f'exact_metadata_gate_count={count}')
          PY

          echo
          echo '=== blame author samples on candidate ==='
          for path in README.md Dockerfile pytwb_ws/src/cm1/cm1/behavior/setlocations.py pytwb_ws/src/cm1/cm1/lib/actor/cognitive.py; do
            if git cat-file -e "$NEW_HEAD:$path" 2>/dev/null; then
              echo "--- $path"
              git blame -w -M -C -C --line-porcelain "$NEW_HEAD" -- "$path" \
                | awk '/^author /{sub(/^author /,""); count[$0]++} END{for (a in count) print count[a], a}' \
                | sort -nr
            fi
          done

          echo
          echo 'PREVIEW_GREEN'
