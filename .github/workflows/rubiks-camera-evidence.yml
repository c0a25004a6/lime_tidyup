name: Rubik Gazebo camera evidence

on:
  pull_request:
    paths:
      - 'Dockerfile.rubiks-physics'
      - 'bin/run_gazebo_preloaded_unsupported_retention_camera'
      - 'project/resource/rubiks_physics_observer_camera.sdf'
      - '.github/workflows/rubiks-camera-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  camera-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PRELOAD_REVIEW_ARTIFACT_ID: '9095667843'
      PRELOAD_REVIEW_ARTIFACT_SHA256: 4d71de1777763f5459b9bc63f27eeb5f03bb90e2d84d8f02c022b91f4b6794ba
      PR47_ARTIFACT_ID: '9095198965'
      PR47_ARTIFACT_SHA256: f91b50e3ad24f2c01fcf6a7fe3f52784a97a7e2ef43473ef0ecfb59faacb2d5e
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}

      - name: Validate native camera harness statically
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_HEAD_SHA}"
          python3 -m py_compile \
            bin/run_rubiks_preloaded_unsupported_retention.py \
            bin/run_rubiks_unsupported_retention.py \
            bin/rubiks_contact_quality.py
          bash -n bin/run_gazebo_preloaded_unsupported_retention_camera
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=Path('project/resource/rubiks_physics_observer_camera.sdf')
          ET.parse(p)
          s=p.read_text()
          assert '<static>true</static>' in s
          assert 'libgazebo_ros_camera.so' in s
          assert '<width>640</width>' in s and '<height>480</height>' in s
          assert '<update_rate>30</update_rate>' in s
          assert '<save enabled="true">' in s
          assert '/artifacts/rubiks_preloaded_unsupported_retention_camera_frames' in s
          r=Path('bin/run_gazebo_preloaded_unsupported_retention_camera').read_text()
          assert 'gzserver --lockstep' in r
          assert '--max-effort 0.25' in r and '--unsupported-seconds 1.0' in r
          assert "! grep -q 'libgazebo_grasp_fix.so'" in r
          assert "! grep -q 'libgazebo_ros_link_attacher.so'" in r
          assert 'GAZEBO_CLASSIC_CAMERA_NATIVE_SAVE' in r
          assert 'ffmpeg' in r and 'ffprobe' in r
          assert 'record_ros_image_mp4.py' not in r
          PY

      - name: Download bound source evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/review artifacts/pr47
          for spec in \
            "${PRELOAD_REVIEW_ARTIFACT_ID}:${PRELOAD_REVIEW_ARTIFACT_SHA256}:review" \
            "${PR47_ARTIFACT_ID}:${PR47_ARTIFACT_SHA256}:pr47"; do
            IFS=: read -r id digest dir <<<"${spec}"
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "artifacts/${dir}.zip"
            printf '%s  %s\n' "${digest}" "artifacts/${dir}.zip" | sha256sum --check --strict
            unzip -q "artifacts/${dir}.zip" -d "artifacts/${dir}"
          done
          test -s artifacts/review/rubiks_supported_preload_evidence_review.json
          test -s artifacts/pr47/rubiks_unsupported_retention_summary.json

      - name: Build unchanged PR49 reproduction input
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          review=json.loads(Path('artifacts/review/rubiks_supported_preload_evidence_review.json').read_text())
          prior=json.loads(Path('artifacts/pr47/rubiks_unsupported_retention_summary.json').read_text())
          selected=review['selected_preload']
          assert review['decision']=='SELECT_Q_0P00675_FOR_UNSUPPORTED_RETENTION_RETRY'
          assert selected['hard_passed'] is True
          assert abs(float(selected['target_m'])-0.00675)<=1e-12
          assert prior['passed'] is False and prior['support_removed'] is True
          assert prior['input']['selected_translation_link7_m']==[0.0475,0.0,0.00825]
          gate=dict(prior['input'])
          gate.update({
            'phase':'RUBIK-PRELOADED-UNSUPPORTED-RETENTION-CAMERA-REPRODUCTION',
            'reviewed_preload_target_m':0.00675,
            'global_max_depth_limit_m':0.001,
            'unsupported_retention_seconds':1.0,
            'camera_evidence_required':True,
            'camera_capture_source':'GAZEBO_CLASSIC_CAMERA_NATIVE_SAVE',
            'camera_lockstep_required':True,
            'camera_expected_width':640,
            'camera_expected_height':480,
            'camera_expected_fps':30.0,
            'physics_parameters_changed_from_pr49':False,
            'arm_motion_authorized_after_fixture_spawn':False,
            'lift_authorized':False,
            'attachment_authorized':False,
          })
          Path('artifacts/rubiks_preloaded_unsupported_retention_camera_gate_input.json').write_text(
            json.dumps(gate,indent=2,sort_keys=True)+'\n')
          PY

      - name: Build grasp physics image with camera support
        run: docker build -f Dockerfile.rubiks-physics -t lime-rubiks-camera:${EXACT_HEAD_SHA} .

      - name: Run actual Gazebo camera reproduction
        run: |
          set -euo pipefail
          set +e
          docker run --rm --network host \
            -v "$PWD/artifacts:/artifacts" \
            lime-rubiks-camera:${EXACT_HEAD_SHA} \
            bash -lc 'bash /root/bin/run_gazebo_preloaded_unsupported_retention_camera /artifacts' \
            >artifacts/container.camera.stdout.log 2>artifacts/container.camera.stderr.log
          rc=$?
          set -e
          printf '%s\n' "${rc}" > artifacts/container.camera.exit_code.txt
          echo "container exit=${rc}; retention failure is expected, camera infrastructure failure is not"

      - name: Validate native lockstep camera artifact
        if: always()
        run: |
          set -euo pipefail
          for f in \
            artifacts/rubiks_preloaded_unsupported_retention_camera.mp4 \
            artifacts/rubiks_preloaded_unsupported_retention_camera_closeup.mp4 \
            artifacts/rubiks_preloaded_unsupported_retention_camera_video.json \
            artifacts/rubiks_preloaded_unsupported_retention_camera_ffprobe.json \
            artifacts/rubiks_preloaded_unsupported_retention_camera_closeup_ffprobe.json \
            artifacts/rubiks_preloaded_unsupported_retention_camera_frame_count.txt \
            artifacts/rubiks_preloaded_unsupported_retention_camera_topic.txt; do
            test -s "$f"
          done
          test -d artifacts/rubiks_preloaded_unsupported_retention_camera_keyframes
          test "$(find artifacts/rubiks_preloaded_unsupported_retention_camera_keyframes -type f -iname '*.jpg' | wc -l)" -eq 5
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('artifacts/rubiks_preloaded_unsupported_retention_camera_video.json').read_text())
          p=json.loads(Path('artifacts/rubiks_preloaded_unsupported_retention_camera_ffprobe.json').read_text())
          cp=json.loads(Path('artifacts/rubiks_preloaded_unsupported_retention_camera_closeup_ffprobe.json').read_text())
          topic=Path('artifacts/rubiks_preloaded_unsupported_retention_camera_topic.txt').read_text().strip()
          count=int(Path('artifacts/rubiks_preloaded_unsupported_retention_camera_frame_count.txt').read_text())
          assert m['capture_source']=='GAZEBO_CLASSIC_CAMERA_NATIVE_SAVE', m
          assert m['gazebo_lockstep'] is True, m
          assert float(m['camera_update_rate_hz'])==30.0, m
          assert m['camera_topic']==topic and topic.startswith('/rubiks_physics_camera') and topic.endswith('/image_raw')
          assert m['passed'] is True, m
          assert count==int(m['frame_count']) and count>=300, (count,m)
          assert int(m['width'])==640 and int(m['height'])==480, m
          assert float(m['video_duration_s'])>=10.0, m
          streams=p.get('streams') or []
          assert len(streams)==1 and int(streams[0]['width'])==640 and int(streams[0]['height'])==480, p
          assert int(streams[0].get('nb_frames') or 0)==count, (streams[0],count)
          fmt=p.get('format') or {}
          assert float(fmt['duration'])>=10.0 and int(fmt['size'])>=10000, p
          cstreams=cp.get('streams') or []
          assert len(cstreams)==1 and int(cstreams[0]['width'])==640 and int(cstreams[0]['height'])==480, cp
          assert int(cstreams[0].get('nb_frames') or 0)==count, (cstreams[0],count)
          print(json.dumps({
            'gazebo_camera_evidence':'PASS',
            'capture_source':m['capture_source'],
            'lockstep':m['gazebo_lockstep'],
            'frames':count,
            'raw_duration_s':fmt['duration'],
            'topic':topic,
          },indent=2))
          PY

      - name: Validate known retention failure still reproduces under evidence scheduling
        if: always()
        run: |
          set -euo pipefail
          test -s artifacts/rubiks_preloaded_unsupported_retention_camera_summary.json
          test -s artifacts/rubiks_preloaded_unsupported_retention_camera_trial_exit_code.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('artifacts/rubiks_preloaded_unsupported_retention_camera_summary.json').read_text())
          rc=int(Path('artifacts/rubiks_preloaded_unsupported_retention_camera_trial_exit_code.txt').read_text())
          assert rc==1 and s['passed'] is False
          assert s['support_contact_before_close'] is True
          assert s['support_removed'] is True and s['support_delete_result']['success'] is True
          supported=s['supported_contact_quality']
          assert supported['passed'] is True and supported['global_depth_passed'] is True
          assert float(supported['left']['quality_fraction'])>=0.80
          assert float(supported['right']['quality_fraction'])>=0.80
          assert float(supported['left']['max_depth_m'])<=0.001
          assert float(supported['right']['max_depth_m'])<=0.001
          unsupported=s['unsupported_contact_quality']
          assert unsupported is not None and unsupported['passed'] is False
          for key in ('arm_motion_performed','arm_command_sent','base_command_sent','lift_command_sent','attachment_used','physical_hardware_used','production_runtime_modified','grasp_success_claimed'):
            assert s[key] is False, (key,s[key])
          print(json.dumps({
            'known_retention_failure_reproduced':True,
            'supported_left_quality':supported['left']['quality_fraction'],
            'supported_right_quality':supported['right']['quality_fraction'],
            'unsupported_left_quality':unsupported['left']['quality_fraction'],
            'unsupported_right_quality':unsupported['right']['quality_fraction'],
            'errors':s['errors'],
            'next_phase':'TEST-ONLY-POSITION-PID-SUPPORTED-CHARACTERIZATION',
          },indent=2))
          PY

      - name: Upload actual camera evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubiks-gazebo-camera-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
