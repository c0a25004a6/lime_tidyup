name: Rubik environment collision evidence gate

on:
  pull_request:
    paths:
      - "bin/audit_rubiks_environment_collision_inputs.py"
      - "bin/rubiks_kinematic_preflight.py"
      - "project/resource/turtlebot3_lime.urdf.xacro"
      - "doc/rubiks_environment_collision_evidence_gate.md"
      - "Dockerfile"
      - ".github/workflows/rubiks-environment-collision-evidence-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rubiks-environment-collision-gate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  environment-collision-evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ACCEPTED_ARTIFACT_ID: "8662639552"
      ACCEPTED_ARTIFACT_SHA256: b5f3bcc6205c57f53e013531d6c5b2bf2bdc0b0e680c664985ea850567bcf1d3
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}

      - name: Validate exact checkout and offline audit source
        run: |
          test "$(git rev-parse HEAD)" = "${EXACT_HEAD_SHA}"
          python3 -m py_compile \
            bin/rubiks_kinematic_preflight.py \
            bin/audit_rubiks_environment_collision_inputs.py
          python3 - <<'PY'
          from pathlib import Path

          text = Path('bin/audit_rubiks_environment_collision_inputs.py').read_text(encoding='utf-8')
          for forbidden in (
              'rclpy', 'ActionClient', 'create_publisher', 'create_client',
              'MoveGroupInterface', 'FollowJointTrajectory', 'GripperCommand',
              'ros2 action', 'ros2 topic pub', 'controller_manager spawner',
          ):
              if forbidden in text:
                  raise SystemExit(f'audit contains a runtime command path: {forbidden}')
          for required in (
              'BLOCKED_INPUT_STATE_MISMATCH_AND_SINGULARITY',
              'measured_arm_joint_state_present', 'matrix_rank',
              'environment_phase_ready', 'actuation_authorized',
          ):
              if required not in text:
                  raise SystemExit(f'audit lacks required negative-evidence field: {required}')
          PY

      - name: Download accepted supported-hold artifact
        run: |
          mkdir -p artifacts
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ACCEPTED_ARTIFACT_ID}/zip" \
            --output artifacts/rubiks-dynamic-supported-hold-evidence.zip
          printf '%s  %s\n' \
            "${ACCEPTED_ARTIFACT_SHA256}" \
            artifacts/rubiks-dynamic-supported-hold-evidence.zip \
            | sha256sum --check --strict

      - name: Build exact-head Lime image
        run: docker build -t lime-tidyup-environment-gate:${EXACT_HEAD_SHA} .

      - name: Audit environment collision inputs
        run: |
          docker run --rm \
            -e SOURCE_REF="${EXACT_HEAD_SHA}" \
            -v "$PWD/artifacts:/artifacts" \
            lime-tidyup-environment-gate:${EXACT_HEAD_SHA} \
            bash -lc '
              set -eo pipefail
              source /opt/ros/humble/setup.bash
              source /project/lib_ws/install/setup.bash
              source /root/turtlebot3_ws/install/setup.bash

              xacro /project/resource/turtlebot3_lime.urdf.xacro use_sim:=true \
                > /artifacts/turtlebot3_lime_environment_gate.urdf
              bringup_share="$(ros2 pkg prefix --share turtlebot3_lime_bringup)"
              cp "${bringup_share}/config/gazebo_controller_manager.yaml" \
                /artifacts/gazebo_controller_manager.yaml

              python3 /root/bin/rubiks_kinematic_preflight.py \
                --urdf /artifacts/turtlebot3_lime_environment_gate.urdf \
                --controller-yaml /artifacts/gazebo_controller_manager.yaml \
                --output /artifacts/rubiks_kinematic_preflight_summary.json \
                --manifest /artifacts/rubiks_kinematic_preflight_evidence.manifest.json \
                --source-ref "${SOURCE_REF}"

              python3 /root/bin/audit_rubiks_environment_collision_inputs.py \
                --accepted-artifact-zip /artifacts/rubiks-dynamic-supported-hold-evidence.zip \
                --current-urdf /artifacts/turtlebot3_lime_environment_gate.urdf \
                --kinematic-summary /artifacts/rubiks_kinematic_preflight_summary.json \
                --output /artifacts/rubiks_environment_collision_evidence_gate_summary.json \
                --manifest /artifacts/rubiks_environment_collision_evidence_gate.manifest.json \
                --source-ref "${SOURCE_REF}"
            ' >artifacts/environment_collision_gate.stdout.log \
              2>artifacts/environment_collision_gate.stderr.log

      - name: Validate exact-head negative evidence
        run: |
          test -s artifacts/rubiks_environment_collision_evidence_gate_summary.json
          test -s artifacts/rubiks_environment_collision_evidence_gate.manifest.json
          python3 - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          expected_head = os.environ['EXACT_HEAD_SHA']
          summary = json.loads(Path('artifacts/rubiks_environment_collision_evidence_gate_summary.json').read_text())
          manifest = json.loads(Path('artifacts/rubiks_environment_collision_evidence_gate.manifest.json').read_text())

          if summary.get('audit_passed') is not True or summary.get('errors') != []:
              raise SystemExit(summary.get('errors'))
          if summary.get('source_ref') != expected_head:
              raise SystemExit('summary is not bound to exact PR head')
          if manifest.get('source_ref') != expected_head or manifest.get('exact_head_bound') is not True:
              raise SystemExit('manifest is not bound to exact PR head')
          if summary.get('decision') != 'BLOCKED_INPUT_STATE_MISMATCH_AND_SINGULARITY':
              raise SystemExit('unexpected phase decision')
          if summary.get('environment_phase_ready') is not False:
              raise SystemExit('environment phase must remain blocked')

          physics = summary.get('accepted_physics_evidence', {})
          if physics.get('artifact_sha256') != os.environ['ACCEPTED_ARTIFACT_SHA256']:
              raise SystemExit('accepted physics artifact digest mismatch')
          if physics.get('measured_arm_joint_state_present') is not False:
              raise SystemExit('missing measured arm state must remain explicit')
          if any(abs(float(value)) > 1e-12 for value in physics.get('configured_initial_arm_joint_positions_rad', {}).values()):
              raise SystemExit('configured supported-hold state must remain all-zero')

          seed = summary.get('kinematic_seed', {})
          if float(seed.get('maximum_absolute_difference_from_configured_physics_state_rad', 0.0)) <= 1.0:
              raise SystemExit('seed/state mismatch is not established')

          jacobian = summary.get('configured_state_jacobian', {})
          if jacobian.get('rank') != 3 or jacobian.get('dimension') != [6, 6]:
              raise SystemExit('unexpected configured-state Jacobian rank')
          if jacobian.get('condition_number') is not None or jacobian.get('condition_number_class') != 'infinite':
              raise SystemExit('configured-state condition must remain infinite')
          plus_y = next(case for case in jacobian.get('cases', []) if case.get('label') == 'plus_y')
          if not math.isclose(float(plus_y.get('lateral_residual_m')), 0.0005, rel_tol=0.0, abs_tol=1e-12):
              raise SystemExit('full lateral residual was not preserved')
          if not math.isclose(float(plus_y.get('achieved_lateral_m')), 0.0, rel_tol=0.0, abs_tol=1e-12):
              raise SystemExit('configured state unexpectedly achieves lateral correction')

          envelope = summary.get('verified_environment_collision_envelope', {})
          if envelope.get('lateral_m') != 0.0 or envelope.get('yaw_rad') != 0.0:
              raise SystemExit('environment collision envelope must remain zero')
          if summary.get('next_required_phase') != 'RUBIK-PREGRASP-STATE-ALIGNMENT-PREFLIGHT':
              raise SystemExit('unexpected corrective phase')

          safety = summary.get('safety', {})
          if safety.get('offline_analysis_only') is not True:
              raise SystemExit('audit must remain offline-only')
          for key in (
              'environment_collision_checked', 'ros_node_created', 'controller_loaded',
              'planning_request_created', 'trajectory_instantiated', 'arm_command_sent',
              'gripper_command_sent', 'actuation_authorized', 'production_runtime_modified',
          ):
              if safety.get(key) is not False:
                  raise SystemExit(f'{key} must remain false')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload environment evidence gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubiks-environment-collision-evidence-gate
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
