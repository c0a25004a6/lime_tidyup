name: Rubik gripper fixture 3D near probe

on:
  pull_request:
    paths:
      - 'Dockerfile.rubiks-collision'
      - 'bin/run_rubiks_gripper_fixture_3d_probe.py'
      - '.github/workflows/rubiks-gripper-fixture-3d-near-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  near-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR27_ARTIFACT_ID: '8985856167'
      PR27_ARTIFACT_SHA256: 86d2b47a2d23fa43686da5a2654ba2568ee8b83c04b14a216e8ef57d025284f3
      X_RESULT_ARTIFACT_ID: '9090099685'
      X_RESULT_ARTIFACT_SHA256: 439886a94e2a90f12e050ad266cb72b6c04d522f0f454bedc636ae09a4d839db
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}

      - name: Validate probe boundary
        run: |
          set -euo pipefail
          python3 -m py_compile \
            bin/prepare_rubiks_grasp_followup.py \
            bin/run_rubiks_gripper_fixture_3d_compatibility_scan.py \
            bin/run_rubiks_gripper_fixture_3d_probe.py \
            bin/validate_rubiks_urdf_package_resources.py
          ! grep -RE 'ActionClient|MoveGroupInterface|FollowJointTrajectory|GripperCommand|create_publisher|create_client' \
            bin/run_rubiks_gripper_fixture_3d_probe.py \
            bin/run_rubiks_gripper_fixture_3d_compatibility_scan.py

      - name: Download pinned evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/pr27 artifacts/x_result
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PR27_ARTIFACT_ID}/zip" \
            -o artifacts/pr27.zip
          printf '%s  %s\n' "${PR27_ARTIFACT_SHA256}" artifacts/pr27.zip | sha256sum --check --strict
          unzip -q artifacts/pr27.zip -d artifacts/pr27

          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${X_RESULT_ARTIFACT_ID}/zip" \
            -o artifacts/x_result.zip
          printf '%s  %s\n' "${X_RESULT_ARTIFACT_SHA256}" artifacts/x_result.zip | sha256sum --check --strict
          unzip -q artifacts/x_result.zip -d artifacts/x_result

      - name: Generate deterministic grid
        run: |
          set -euo pipefail
          python3 bin/prepare_rubiks_grasp_followup.py \
            --pr28-summary artifacts/x_result/rubiks_gripper_fixture_x_compatibility_summary.json \
            --output artifacts/probe_plan.json \
            --candidates-output artifacts/all_3d_candidates.tsv

      - name: Build collision image
        run: |
          set -euo pipefail
          docker build -f Dockerfile.rubiks-collision -t lime-rubiks-near:${EXACT_HEAD_SHA} .

      - name: Probe nearest 256 and full-path gate
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/artifacts:/artifacts" \
            lime-rubiks-near:${EXACT_HEAD_SHA} \
            bash -lc '
              set -eo pipefail
              source /opt/ros/humble/setup.bash
              source /opt/lime_description_ws/install/setup.bash
              source /opt/rubiks_ws/install/setup.bash
              set -u

              python3 /opt/rubiks/bin/validate_rubiks_urdf_package_resources.py \
                --urdf /artifacts/pr27/pr26/pr23/accepted/turtlebot3_lime_fixture_current.urdf

              PYTHONPATH=/opt/rubiks/bin python3 /opt/rubiks/bin/run_rubiks_gripper_fixture_3d_probe.py \
                --candidates /artifacts/all_3d_candidates.tsv \
                --fixture /artifacts/pr27/pr26/pr23/accepted/rubiks_pregrasp_fixture_contract.tsv \
                --sweep-executable /opt/rubiks_ws/install/lib/rubiks_self_collision_preflight/rubiks_corrected_fixture_gripper_sweep_preflight \
                --urdf /artifacts/pr27/pr26/pr23/accepted/turtlebot3_lime_fixture_current.urdf \
                --srdf /artifacts/pr27/pr26/pr23/accepted/turtlebot3_lime_fixture_current.srdf \
                --states /artifacts/pr27/pr26/pr23/accepted/pregrasp/rubiks_pregrasp_gripper_ground_states.tsv \
                --work-dir /artifacts/probe_detail \
                --scan-output /artifacts/probe_scan.tsv \
                --compatible-candidates /artifacts/probe_compatible.tsv \
                --limit 256 --workers 8

              compatible_count="$(head -n1 /artifacts/probe_compatible.tsv | cut -f4)"
              if [[ "${compatible_count}" -gt 0 ]]; then
                /opt/rubiks_ws/install/lib/rubiks_self_collision_preflight/rubiks_relevance_candidate_batch_preflight \
                  /artifacts/pr27/pr26/pr23/accepted/turtlebot3_lime_fixture_current.urdf \
                  /artifacts/pr27/pr26/pr23/accepted/turtlebot3_lime_fixture_current.srdf \
                  /artifacts/pr27/pr26/pr23/accepted/pregrasp/rubiks_pregrasp_gripper_ground_states.tsv \
                  /artifacts/pr27/pr26/pr23/accepted/rubiks_pregrasp_fixture_contract.tsv \
                  /artifacts/probe_compatible.tsv \
                  /artifacts/probe_full_path.tsv
              fi
              rm -rf /artifacts/probe_detail
            '

      - name: Report probe result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          meta = Path('artifacts/probe_scan.tsv').read_text().splitlines()[0].split('\t')
          assert meta[:3] == ['META', '1', 'XYZ_REMAINING']
          assert int(meta[3]) == 256
          compatible = int(meta[4])
          found = False
          selected = None
          path = Path('artifacts/probe_full_path.tsv')
          if path.is_file():
              for line in path.read_text().splitlines():
                  fields = line.split('\t')
                  if fields[0] == 'SELECT':
                      found = fields[1] == 'true'
                      selected = fields[2:5] if found else None
          print(f'near_probe_candidates=256 sweep_compatible={compatible} full_path_clear={found} selected={selected}')
          PY

      - name: Upload compact probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubiks-gripper-fixture-3d-near-probe
          path: |
            artifacts/probe_plan.json
            artifacts/probe_scan.tsv
            artifacts/probe_compatible.tsv
            artifacts/probe_full_path.tsv
          if-no-files-found: warn
          retention-days: 30
