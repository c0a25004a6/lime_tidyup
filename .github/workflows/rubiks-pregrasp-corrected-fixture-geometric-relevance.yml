name: Rubik corrected fixture geometric relevance

on:
  pull_request:
    paths:
      - "bin/prepare_rubiks_pregrasp_corrected_fixture_relevance.py"
      - "bin/capture_rubiks_gripper_mesh_provenance.py"
      - "bin/audit_rubiks_corrected_fixture_geometric_relevance.py"
      - "bin/summarize_rubiks_pregrasp_corrected_fixture_relevance.py"
      - "doc/rubiks_pregrasp_corrected_fixture_geometric_relevance.md"
      - ".github/workflows/rubiks-pregrasp-corrected-fixture-geometric-relevance.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rubiks-corrected-fixture-geometric-relevance-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  command-free-geometric-relevance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ACCEPTED_ARTIFACT_ID: "8890739787"
      ACCEPTED_ARTIFACT_SHA256: 9a56dea2d3384feec3622e60f733bf13d8798da768447fc9a33e18ed3ba7fa76
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}

      - name: Validate exact checkout and standard-library boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_HEAD_SHA}"
          python3 -m py_compile \
            bin/prepare_rubiks_pregrasp_corrected_fixture_relevance.py \
            bin/capture_rubiks_gripper_mesh_provenance.py \
            bin/audit_rubiks_corrected_fixture_geometric_relevance.py \
            bin/summarize_rubiks_pregrasp_corrected_fixture_relevance.py
          python3 - <<'PY'
          import ast
          from pathlib import Path

          paths = {
              'prepare': Path('bin/prepare_rubiks_pregrasp_corrected_fixture_relevance.py'),
              'provenance': Path('bin/capture_rubiks_gripper_mesh_provenance.py'),
              'audit': Path('bin/audit_rubiks_corrected_fixture_geometric_relevance.py'),
              'summary': Path('bin/summarize_rubiks_pregrasp_corrected_fixture_relevance.py'),
          }
          texts = {label: path.read_text() for label, path in paths.items()}
          for label, text in texts.items():
              for forbidden in (
                  'rclpy', 'rclcpp::Node', 'ActionClient', 'create_publisher',
                  'create_client', 'MoveGroupInterface', 'FollowJointTrajectory',
                  'GripperCommand', 'spawn_entity', 'checkCollision',
                  'subprocess.Popen', 'os.system',
              ):
                  if forbidden in text:
                      raise SystemExit(f'{label} contains runtime path: {forbidden}')

          tree = ast.parse(texts['audit'])
          imported = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imported.add(node.module.split('.')[0])
          allowed = {'__future__', 'argparse', 'math', 'struct', 'dataclasses', 'pathlib', 'xml'}
          unexpected = imported - allowed
          if unexpected:
              raise SystemExit(f'audit contains non-standard imports: {sorted(unexpected)}')

          requirements = {
              'prepare': (
                  'PR23_SOURCE', 'EXPECTED_TRANSLATION',
                  'translation_within_cube_half_extent_box',
                  'collision_mesh_aabb_envelopes_only',
              ),
              'provenance': (
                  'source_repository', 'sha256', 'gripper_left_link',
                  'gripper_right_link', 'read_only_filesystem_inspection',
              ),
              'audit': (
                  'stl_vertices', 'struct.unpack_from', 'triangle_count',
                  'vertex_count', 'EXPECTED_PACKAGE', 'positive_xz',
                  'CORRECTED_FIXTURE_GEOMETRICALLY_RELEVANT',
                  'BLOCKED_CORRECTED_FIXTURE_OUTSIDE_FINGER_REACH_ENVELOPE',
              ),
              'summary': (
                  'stl_geometry', 'exact_urdf_referenced_stl_vertices_used',
                  'collision_mesh_aabb_envelopes_only',
                  'exact_mesh_surface_contact_claimed',
                  'force_closure_claimed', 'grasp_success_claimed',
                  'RUBIK-PREGRASP-CORRECTED-FIXTURE-OFFLINE-GRIPPER-SWEEP-COLLISION-PREFLIGHT',
                  'RUBIK-PREGRASP-GRASP-RELEVANCE-CONSTRAINED-FIXTURE-SEARCH',
              ),
          }
          for label, tokens in requirements.items():
              for token in tokens:
                  if token not in texts[label]:
                      raise SystemExit(f'{label} lacks required contract token: {token}')

          obsolete = Path('project/rubiks_self_collision_ws/src/rubiks_self_collision_preflight/src/rubiks_corrected_fixture_geometric_relevance_preflight.cpp')
          if obsolete.exists():
              raise SystemExit('obsolete MoveIt relevance checker remains')
          cmake = Path('project/rubiks_self_collision_ws/src/rubiks_self_collision_preflight/CMakeLists.txt').read_text()
          if 'rubiks_corrected_fixture_geometric_relevance_preflight' in cmake:
              raise SystemExit('obsolete relevance target remains in CMake')
          PY

      - name: Download accepted PR23 correction evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/accepted
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ACCEPTED_ARTIFACT_ID}/zip" \
            -o artifacts/accepted.zip
          printf '%s  %s\n' "${ACCEPTED_ARTIFACT_SHA256}" artifacts/accepted.zip | sha256sum --check --strict
          unzip -q artifacts/accepted.zip -d artifacts/accepted

      - name: Fetch exact external gripper mesh source
        run: |
          set -euo pipefail
          mkdir -p external
          git clone --depth 1 --single-branch --branch humble-devel \
            https://github.com/ROBOTIS-JAPAN-GIT/turtlebot3_lime.git \
            external/turtlebot3_lime
          git -C external/turtlebot3_lime status --porcelain | tee artifacts/external_source_status.txt
          test ! -s artifacts/external_source_status.txt
          git -C external/turtlebot3_lime rev-parse HEAD | tee artifacts/external_source_commit.txt
          git -C external/turtlebot3_lime remote get-url origin | tee artifacts/external_source_origin.txt

      - name: Run exact-STL command-free relevance audit
        run: |
          set -euo pipefail
          python3 bin/prepare_rubiks_pregrasp_corrected_fixture_relevance.py \
            --accepted-dir artifacts/accepted \
            --contract-tsv artifacts/rubiks_pregrasp_corrected_fixture_relevance_contract.tsv \
            --output artifacts/rubiks_pregrasp_corrected_fixture_relevance_input_binding.json \
            --source-ref "${EXACT_HEAD_SHA}" \
            >artifacts/corrected_fixture_relevance_prepare.stdout.log \
            2>artifacts/corrected_fixture_relevance_prepare.stderr.log

          python3 bin/capture_rubiks_gripper_mesh_provenance.py \
            --urdf artifacts/accepted/accepted/turtlebot3_lime_fixture_current.urdf \
            --package-share external/turtlebot3_lime/turtlebot3_lime_description \
            --source-repo external/turtlebot3_lime \
            --output artifacts/rubiks_pregrasp_corrected_fixture_mesh_provenance.json \
            --source-ref "${EXACT_HEAD_SHA}" \
            >artifacts/corrected_fixture_relevance_provenance.stdout.log \
            2>artifacts/corrected_fixture_relevance_provenance.stderr.log

          python3 bin/audit_rubiks_corrected_fixture_geometric_relevance.py \
            --urdf artifacts/accepted/accepted/turtlebot3_lime_fixture_current.urdf \
            --package-share external/turtlebot3_lime/turtlebot3_lime_description \
            --contract artifacts/rubiks_pregrasp_corrected_fixture_relevance_contract.tsv \
            --output artifacts/rubiks_pregrasp_corrected_fixture_relevance_results.tsv \
            >artifacts/corrected_fixture_relevance_audit.stdout.log \
            2>artifacts/corrected_fixture_relevance_audit.stderr.log

          python3 bin/summarize_rubiks_pregrasp_corrected_fixture_relevance.py \
            --binding artifacts/rubiks_pregrasp_corrected_fixture_relevance_input_binding.json \
            --mesh-provenance artifacts/rubiks_pregrasp_corrected_fixture_mesh_provenance.json \
            --results artifacts/rubiks_pregrasp_corrected_fixture_relevance_results.tsv \
            --contract artifacts/rubiks_pregrasp_corrected_fixture_relevance_contract.tsv \
            --urdf artifacts/accepted/accepted/turtlebot3_lime_fixture_current.urdf \
            --srdf artifacts/accepted/accepted/turtlebot3_lime_fixture_current.srdf \
            --output artifacts/rubiks_pregrasp_corrected_fixture_geometric_relevance_summary.json \
            --manifest artifacts/rubiks_pregrasp_corrected_fixture_geometric_relevance_evidence.manifest.json \
            --source-ref "${EXACT_HEAD_SHA}" \
            >artifacts/corrected_fixture_relevance_summary.stdout.log \
            2>artifacts/corrected_fixture_relevance_summary.stderr.log

      - name: Validate exact-head relevance evidence and decision
        run: |
          set -euo pipefail
          test -s artifacts/rubiks_pregrasp_corrected_fixture_geometric_relevance_summary.json
          test -s artifacts/rubiks_pregrasp_corrected_fixture_geometric_relevance_evidence.manifest.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('artifacts')
          summary = json.loads((root / 'rubiks_pregrasp_corrected_fixture_geometric_relevance_summary.json').read_text())
          manifest = json.loads((root / 'rubiks_pregrasp_corrected_fixture_geometric_relevance_evidence.manifest.json').read_text())

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          require(summary.get('audit_passed') is True and summary.get('errors') == [], 'relevance audit failed')
          require(summary.get('source_ref') == os.environ['EXACT_HEAD_SHA'], 'summary source mismatch')
          require(summary.get('exact_head_bound') is True, 'exact-head flag missing')
          decision = summary.get('decision')
          require(decision in (
              'CORRECTED_FIXTURE_GEOMETRICALLY_RELEVANT',
              'BLOCKED_CORRECTED_FIXTURE_OUTSIDE_FINGER_REACH_ENVELOPE',
          ), 'unexpected relevance decision')
          relevant = summary.get('corrected_fixture_geometrically_relevant') is True
          require((decision == 'CORRECTED_FIXTURE_GEOMETRICALLY_RELEVANT') is relevant, 'decision/relevance mismatch')
          require(summary.get('correction_translation_link7_m') == [0.0, 0.0, 0.04575], 'translation mismatch')
          require(summary.get('cube_center_link7_m') == [-0.019, 0.0, 0.16495], 'cube center mismatch')
          require(set(summary.get('collision_mesh_aabb', {})) == {'gripper_left_link', 'gripper_right_link'}, 'mesh AABB coverage mismatch')
          stls = summary.get('stl_geometry', {})
          require(set(stls) == {'gripper_left_link', 'gripper_right_link'}, 'STL geometry coverage mismatch')
          for link, entry in stls.items():
              require(entry.get('format') in {'binary', 'ascii'}, f'STL format mismatch: {link}')
              require(entry.get('triangle_count', 0) > 0, f'STL triangle count missing: {link}')
              require(entry.get('vertex_count') == entry.get('triangle_count') * 3, f'STL vertex count mismatch: {link}')
          provenance = summary.get('mesh_provenance', {})
          require(provenance.get('passed') is True, 'mesh provenance failed')
          source_repository = provenance.get('source_repository', {})
          require('ROBOTIS-JAPAN-GIT/turtlebot3_lime' in source_repository.get('origin', ''), 'unexpected external source origin')
          require(len(source_repository.get('commit', '')) == 40, 'external source commit missing')
          require(source_repository.get('clean') is True, 'external source clone is dirty')
          meshes = provenance.get('meshes', {})
          require(set(meshes) == {'gripper_left_link', 'gripper_right_link'}, 'mesh provenance coverage mismatch')
          for link, entry in meshes.items():
              require(len(entry.get('sha256', '')) == 64, f'mesh digest missing: {link}')
              require(entry.get('size_bytes', 0) > 0, f'mesh size missing: {link}')
              require(entry.get('resource') == stls[link].get('resource'), f'mesh resource mismatch: {link}')
          limits = summary.get('claim_limits', {})
          require(limits.get('exact_urdf_referenced_stl_vertices_used') is True, 'exact STL claim missing')
          require(limits.get('collision_mesh_aabb_envelopes_only') is True, 'AABB claim missing')
          for key in (
              'exact_mesh_surface_contact_claimed', 'contact_normal_claimed',
              'force_closure_claimed', 'friction_claimed',
              'support_clearance_during_gripper_motion_claimed',
              'ground_clearance_during_gripper_motion_claimed',
              'grasp_success_claimed', 'lifting_or_transport_claimed',
              'hardware_readiness_claimed',
          ):
              require(limits.get(key) is False, f'{key} must remain false')
          safety = summary.get('safety', {})
          require(safety.get('offline_analysis_only') is True, 'offline boundary missing')
          require(safety.get('standard_library_geometry_audit_only') is True, 'standard-library boundary missing')
          require(safety.get('moveit_model_loaded') is False, 'MoveIt must remain unused')
          for key in (
              'gazebo_started', 'ros_node_created', 'object_spawned',
              'controller_loaded', 'planning_request_created',
              'trajectory_instantiated', 'command_sent', 'attachment_used',
              'physical_hardware_used', 'production_runtime_modified',
          ):
              require(safety.get(key) is False, f'{key} must remain false')
          require(manifest.get('source_ref') == os.environ['EXACT_HEAD_SHA'], 'manifest source mismatch')
          require(manifest.get('decision') == decision, 'manifest decision mismatch')
          require(manifest.get('corrected_fixture_geometrically_relevant') is relevant, 'manifest relevance mismatch')
          require(manifest.get('external_source_commit') == source_repository.get('commit'), 'manifest source commit mismatch')
          require(len(manifest.get('inputs', {})) == 6, 'manifest input coverage mismatch')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload corrected fixture relevance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubiks-pregrasp-corrected-fixture-geometric-relevance-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
