name: Rubik pregrasp fixture relative alignment search

on:
  pull_request:
    paths:
      - "bin/prepare_rubiks_pregrasp_fixture_alignment_search.py"
      - "bin/summarize_rubiks_pregrasp_fixture_alignment_search.py"
      - "project/rubiks_self_collision_ws/**"
      - "doc/rubiks_pregrasp_fixture_relative_alignment_search.md"
      - "Dockerfile"
      - ".github/workflows/rubiks-pregrasp-fixture-relative-alignment-search.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rubiks-pregrasp-fixture-alignment-search-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deterministic-offline-alignment-search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ACCEPTED_ARTIFACT_ID: "8864460091"
      ACCEPTED_ARTIFACT_SHA256: 374f46eb6dccb963a2c326f02ca7602262d6616fccc4f248b06f8e9d1b240ea7
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}

      - name: Validate exact checkout and offline search boundary
        run: |
          test "$(git rev-parse HEAD)" = "${EXACT_HEAD_SHA}"
          python3 -m py_compile \
            bin/prepare_rubiks_pregrasp_fixture_alignment_search.py \
            bin/summarize_rubiks_pregrasp_fixture_alignment_search.py
          python3 - <<'PY'
          from pathlib import Path

          prepare = Path('bin/prepare_rubiks_pregrasp_fixture_alignment_search.py').read_text()
          summary = Path('bin/summarize_rubiks_pregrasp_fixture_alignment_search.py').read_text()
          checker = Path('project/rubiks_self_collision_ws/src/rubiks_self_collision_preflight/src/rubiks_fixture_alignment_search_preflight.cpp').read_text()
          cmake = Path('project/rubiks_self_collision_ws/src/rubiks_self_collision_preflight/CMakeLists.txt').read_text()

          for text, label in ((prepare, 'prepare'), (summary, 'summary'), (checker, 'checker')):
              for forbidden in (
                  'rclpy', 'rclcpp::Node', 'ActionClient', 'create_publisher',
                  'create_client', 'MoveGroupInterface', 'FollowJointTrajectory',
                  'GripperCommand', 'spawn_entity',
              ):
                  if forbidden in text:
                      raise SystemExit(f'{label} contains runtime path: {forbidden}')
          for required in (
              'PR22_SOURCE', 'BLOCKED_ROBOT_FIXTURE_COLLISION',
              'coarse_step_m', 'coarse_radius_m',
              'continuous_global_optimum_claimed', 'grasp_relevance_claimed',
          ):
              if required not in prepare:
                  raise SystemExit(f'prepare lacks input/search contract: {required}')
          for required in (
              'COARSE_STEP_M = 0.002', 'COARSE_RADIUS_STEPS = 40',
              'FINE_STEP_M = 0.00025', 'FINE_RADIUS_STEPS = 8',
              'evaluate_translation', 'FULL_PATH_CLEAR_TRANSLATION_FOUND',
              'NO_FULL_PATH_CLEAR_TRANSLATION_WITHIN_COARSE_RADIUS',
              'rubiks_cube', 'rubiks_support', 'checkCollision',
          ):
              if required not in checker:
                  raise SystemExit(f'checker lacks deterministic operation: {required}')
          for required in (
              'EXPECTED_COARSE_CANDIDATE_COUNT = 267761',
              'EXPECTED_FINE_CANDIDATE_COUNT = 4913',
              'nearest_clear_candidate_on_coarse_grid_then_local_fine_grid_only',
              'continuous_global_optimum_claimed', 'rotation_search_performed',
              'grasp_relevance_claimed',
          ):
              if required not in summary:
                  raise SystemExit(f'summary lacks claim boundary: {required}')
          if 'rubiks_fixture_alignment_search_preflight' not in cmake:
              raise SystemExit('alignment search target is not installed')
          PY

      - name: Download accepted PR22 fixture evidence
        run: |
          mkdir -p artifacts/accepted
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ACCEPTED_ARTIFACT_ID}/zip" \
            -o artifacts/accepted.zip
          printf '%s  %s\n' "${ACCEPTED_ARTIFACT_SHA256}" artifacts/accepted.zip | sha256sum --check --strict
          unzip -q artifacts/accepted.zip -d artifacts/accepted

      - name: Build exact-head Lime image
        run: docker build -t lime-tidyup-fixture-alignment:${EXACT_HEAD_SHA} .

      - name: Run deterministic full-path translation search
        run: |
          docker run --rm \
            -e SOURCE_REF="${EXACT_HEAD_SHA}" \
            -v "$PWD/artifacts:/artifacts" \
            lime-tidyup-fixture-alignment:${EXACT_HEAD_SHA} \
            bash -lc '
              set -eo pipefail
              source /opt/ros/humble/setup.bash
              source /project/lib_ws/install/setup.bash
              source /root/turtlebot3_ws/install/setup.bash

              python3 /root/bin/prepare_rubiks_pregrasp_fixture_alignment_search.py \
                --accepted-dir /artifacts/accepted \
                --output /artifacts/rubiks_pregrasp_fixture_alignment_search_input_binding.json \
                --source-ref "${SOURCE_REF}"

              colcon build \
                --merge-install \
                --base-paths /project/rubiks_self_collision_ws/src \
                --build-base /tmp/rubiks_fixture_alignment_build \
                --install-base /tmp/rubiks_fixture_alignment_install \
                --cmake-args -DCMAKE_BUILD_TYPE=Release \
                --event-handlers console_direct+
              source /tmp/rubiks_fixture_alignment_install/setup.bash

              /tmp/rubiks_fixture_alignment_install/lib/rubiks_self_collision_preflight/rubiks_fixture_alignment_search_preflight \
                /artifacts/accepted/turtlebot3_lime_fixture_current.urdf \
                /artifacts/accepted/turtlebot3_lime_fixture_current.srdf \
                /artifacts/accepted/pregrasp/rubiks_pregrasp_gripper_ground_states.tsv \
                /artifacts/accepted/rubiks_pregrasp_fixture_contract.tsv \
                /artifacts/rubiks_pregrasp_fixture_alignment_search_results.tsv

              python3 /root/bin/summarize_rubiks_pregrasp_fixture_alignment_search.py \
                --binding /artifacts/rubiks_pregrasp_fixture_alignment_search_input_binding.json \
                --accepted-summary /artifacts/accepted/rubiks_pregrasp_fixture_offline_summary.json \
                --accepted-manifest /artifacts/accepted/rubiks_pregrasp_fixture_offline_evidence.manifest.json \
                --results /artifacts/rubiks_pregrasp_fixture_alignment_search_results.tsv \
                --states /artifacts/accepted/pregrasp/rubiks_pregrasp_gripper_ground_states.tsv \
                --fixture /artifacts/accepted/rubiks_pregrasp_fixture_contract.tsv \
                --urdf /artifacts/accepted/turtlebot3_lime_fixture_current.urdf \
                --srdf /artifacts/accepted/turtlebot3_lime_fixture_current.srdf \
                --output /artifacts/rubiks_pregrasp_fixture_alignment_search_summary.json \
                --manifest /artifacts/rubiks_pregrasp_fixture_alignment_search_evidence.manifest.json \
                --source-ref "${SOURCE_REF}"
            ' >artifacts/fixture_alignment_search.stdout.log \
              2>artifacts/fixture_alignment_search.stderr.log

      - name: Validate exact-head search evidence and decision
        run: |
          test -s artifacts/rubiks_pregrasp_fixture_alignment_search_summary.json
          test -s artifacts/rubiks_pregrasp_fixture_alignment_search_evidence.manifest.json
          python3 - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          root = Path('artifacts')
          summary = json.loads((root / 'rubiks_pregrasp_fixture_alignment_search_summary.json').read_text())
          manifest = json.loads((root / 'rubiks_pregrasp_fixture_alignment_search_evidence.manifest.json').read_text())

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          require(summary.get('audit_passed') is True and summary.get('errors') == [], 'search evidence audit failed')
          require(summary.get('source_ref') == os.environ['EXACT_HEAD_SHA'], 'summary source mismatch')
          require(summary.get('exact_head_bound') is True, 'summary exact-head flag missing')
          decision = summary.get('decision')
          require(decision in (
              'FULL_PATH_CLEAR_TRANSLATION_FOUND',
              'NO_FULL_PATH_CLEAR_TRANSLATION_WITHIN_COARSE_RADIUS',
          ), 'unexpected search decision')

          baseline = summary.get('baseline_reproduction', {})
          require(baseline.get('clear') is False, 'baseline unexpectedly clear')
          require(baseline.get('first_collision_state_index') == 0, 'baseline collision index mismatch')
          require(baseline.get('cube_collision') is True, 'baseline cube collision missing')
          require(baseline.get('support_collision') is True, 'baseline support collision missing')

          coarse = summary.get('coarse_search', {})
          require(coarse.get('candidate_count') == 267761, 'coarse candidate count mismatch')
          require(math.isclose(coarse.get('step_m', math.nan), 0.002, abs_tol=1e-15), 'coarse step mismatch')
          require(math.isclose(coarse.get('radius_m', math.nan), 0.08, abs_tol=1e-15), 'coarse radius mismatch')
          require(coarse.get('candidates_checked', 0) > 0, 'coarse search checked no candidates')

          found = summary.get('correction_candidate_found') is True
          require(summary.get('correction_phase_ready') is found, 'correction readiness mismatch')
          if found:
              require(decision == 'FULL_PATH_CLEAR_TRANSLATION_FOUND', 'positive decision mismatch')
              fine = summary.get('fine_search', {})
              require(fine.get('candidate_count') == 4913, 'fine candidate count mismatch')
              require(fine.get('found') is True, 'fine search did not retain a candidate')
              candidate = summary.get('selected_candidate', {})
              require(candidate.get('full_recorded_path_clear') is True, 'selected path not clear')
              require(candidate.get('cube_support_relative_transform_preserved') is True, 'fixture relation changed')
              audit = summary.get('selected_path_audit', {})
              require(audit.get('state_count') == 2802, 'selected state count mismatch')
              require(audit.get('all_bounds_ok') is True, 'selected bounds failure')
              require(audit.get('all_self_collision_free') is True, 'selected self collision')
              require(audit.get('all_cube_clear') is True, 'selected cube collision')
              require(audit.get('all_support_clear') is True, 'selected support collision')
              require(audit.get('contact_pair_count') == 0, 'selected fixture contacts reported')
          else:
              require(decision == 'NO_FULL_PATH_CLEAR_TRANSLATION_WITHIN_COARSE_RADIUS', 'negative decision mismatch')
              require(coarse.get('candidates_checked') == 267761, 'negative coarse search incomplete')
              require(summary.get('selected_path_audit', {}).get('state_count') == 0, 'negative search emitted selected states')

          limits = summary.get('claim_limits', {})
          require(limits.get('nearest_clear_candidate_on_coarse_grid_then_local_fine_grid_only') is True, 'grid claim missing')
          for key in (
              'continuous_global_optimum_claimed', 'rotation_search_performed',
              'grasp_relevance_claimed', 'contact_quality_claimed',
              'distance_margin_claimed', 'gazebo_stability_claimed',
              'actuation_or_hardware_readiness_claimed',
          ):
              require(limits.get(key) is False, f'{key} must remain false')

          safety = summary.get('safety', {})
          require(safety.get('offline_analysis_only') is True, 'offline boundary missing')
          require(safety.get('accepted_passive_finger_states_unchanged') is True, 'passive state boundary missing')
          require(safety.get('cube_support_rigid_relation_preserved') is True, 'rigid fixture boundary missing')
          for key in (
              'gazebo_started', 'ros_node_created', 'object_spawned',
              'controller_loaded', 'planning_request_created',
              'trajectory_instantiated', 'arm_command_sent',
              'gripper_command_sent', 'attachment_used',
              'physical_hardware_used', 'production_runtime_modified',
          ):
              require(safety.get(key) is False, f'{key} must remain false')

          require(manifest.get('source_ref') == os.environ['EXACT_HEAD_SHA'], 'manifest source mismatch')
          require(manifest.get('decision') == decision, 'manifest decision mismatch')
          require(manifest.get('correction_candidate_found') is found, 'manifest found mismatch')
          require(manifest.get('coarse_candidate_count') == 267761, 'manifest coarse count mismatch')
          require(len(manifest.get('inputs', {})) == 8, 'manifest input coverage mismatch')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload fixture alignment search evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubiks-pregrasp-fixture-relative-alignment-search-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
