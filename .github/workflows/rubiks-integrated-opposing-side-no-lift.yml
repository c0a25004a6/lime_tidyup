name: Rubik integrated opposing-side no-lift

on:
  pull_request:
    paths:
      - 'bin/run_rubiks_integrated_opposing_side_no_lift.py'
      - 'bin/run_gazebo_integrated_opposing_side_no_lift'
      - 'bin/run_rubiks_dynamic_opposing_side_hold_v2.py'
      - 'bin/rubiks_contact_quality.py'
      - 'Dockerfile.rubiks-physics'
      - '.github/workflows/rubiks-integrated-opposing-side-no-lift.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  integrated-opposing-side-no-lift:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR45_ARTIFACT_ID: '9094667574'
      PR45_ARTIFACT_SHA256: 4abf531244828bb8ac07c6082440f3d79fec96bec177d29fa44f31e80e244f77
      PR44_ARTIFACT_ID: '9094349012'
      PR44_ARTIFACT_SHA256: 7e74927d81b8e7898bc62a0404cc461f10ca6b2c3925f67dd992bd8efdfb4af8
      PR37_ARTIFACT_ID: '9090771854'
      PR37_ARTIFACT_SHA256: 13b34c0984582b5ac7e882891726744163702e74073cdc9af56287fa91e53d2b
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}

      - name: Validate integrated harness and safety boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_HEAD_SHA}"
          python3 -m py_compile \
            bin/run_rubiks_integrated_opposing_side_no_lift.py \
            bin/run_rubiks_dynamic_opposing_side_hold_v2.py \
            bin/rubiks_contact_quality.py \
            bin/run_rubiks_open_arm_pregrasp_setup.py
          python3 bin/rubiks_contact_quality.py --self-test
          bash -n bin/run_gazebo_integrated_opposing_side_no_lift
          python3 - <<'PY'
          from pathlib import Path
          text=Path('bin/run_rubiks_integrated_opposing_side_no_lift.py').read_text()
          assert 'audit_contact_quality' in text
          assert 'opposing_side_close_step_integrated_' in text
          assert 'legacy_scalar_opening_gate_used": False' in text
          assert 'fixture_present_during_open_arm_cycle' in text
          for token in ('lift_command_sent": False','attachment_used": False','base_command_sent": False','physical_hardware_used": False','production_runtime_modified": False','grasp_success_claimed": False'):
              assert token in text, token
          runner=Path('bin/run_gazebo_integrated_opposing_side_no_lift').read_text()
          assert 'libgazebo_grasp_fix.so' in runner
          assert 'libgazebo_ros_link_attacher.so' in runner
          PY

      - name: Download accepted repeatability path and anchor evidence
        run: |
          set -euo pipefail
          download_artifact() {
            local id="$1" digest="$2" zip="$3" out="$4"
            mkdir -p "${out}"
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "${zip}"
            printf '%s  %s\n' "${digest}" "${zip}" | sha256sum --check --strict
            unzip -q "${zip}" -d "${out}"
          }
          download_artifact "${PR45_ARTIFACT_ID}" "${PR45_ARTIFACT_SHA256}" artifacts/pr45.zip artifacts/pr45
          download_artifact "${PR44_ARTIFACT_ID}" "${PR44_ARTIFACT_SHA256}" artifacts/pr44.zip artifacts/pr44
          download_artifact "${PR37_ARTIFACT_ID}" "${PR37_ARTIFACT_SHA256}" artifacts/pr37.zip artifacts/pr37
          test -s artifacts/pr45/rubiks_selected_contact_repeatability_summary.json
          test -s artifacts/pr44/selected_dynamic_open_path_summary.json
          test -s artifacts/pr37/rubiks_pregrasp_open_gripper_states.tsv

      - name: Bind exact integrated gate input
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          repeat=json.loads(Path('artifacts/pr45/rubiks_selected_contact_repeatability_summary.json').read_text())
          assert repeat['decision']=='SELECTED_CONTACT_REPEATABLE_AND_OPEN_PATH_CLEAR'
          assert repeat['all_repeats_passed'] is True
          assert repeat['passing_repeat_count']==3 and repeat['repeat_count']==3
          assert repeat['acceptance_thresholds_unchanged'] is True
          assert float(repeat['minimum_left_quality_fraction']) >= 0.80
          assert float(repeat['minimum_right_quality_fraction']) >= 0.80
          selected=[float(v) for v in repeat['selected_translation_link7_m']]
          assert selected==[0.0475,0.0,0.00825]

          path=json.loads(Path('artifacts/pr44/selected_dynamic_open_path_summary.json').read_text())
          assert path['open_path_clear'] is True and path['states_checked']==2802
          assert path['selected_translation_link7_m']==selected

          states=Path('artifacts/pr37/rubiks_pregrasp_open_gripper_states.tsv').read_text().splitlines()
          assert len(states)==2802
          anchor=states[1541].split('\t')
          assert anchor[0]=='sample_001541' and len(anchor)==16
          arm=[float(v) for v in anchor[8:14]]
          assert abs(float(anchor[14])-0.019)<=1e-12
          assert abs(float(anchor[15])-0.019)<=1e-12

          cube_fixture=[-0.019,0.0,0.1192]
          support_fixture=[-0.019,0.0,0.0857]
          cube=[cube_fixture[i]+selected[i] for i in range(3)]
          support=[support_fixture[i]+selected[i] for i in range(3)]
          assert all(abs(a-b)<=1e-12 for a,b in zip(cube,[0.0285,0.0,0.12745]))
          assert all(abs(a-b)<=1e-12 for a,b in zip(support,[0.0285,0.0,0.09395]))

          gate={
              'schema_version':1,
              'phase':'RUBIK-INTEGRATED-OPPOSING-SIDE-DYNAMIC-NO-LIFT',
              'source_pr45_artifact_id':9094667574,
              'source_pr45_artifact_sha256':'4abf531244828bb8ac07c6082440f3d79fec96bec177d29fa44f31e80e244f77',
              'source_pr44_artifact_id':9094349012,
              'source_pr44_artifact_sha256':'7e74927d81b8e7898bc62a0404cc461f10ca6b2c3925f67dd992bd8efdfb4af8',
              'source_pr37_artifact_id':9090771854,
              'source_pr37_artifact_sha256':'13b34c0984582b5ac7e882891726744163702e74073cdc9af56287fa91e53d2b',
              'selected_translation_link7_m':selected,
              'arm_anchor_index':1541,
              'arm_target_rad':arm,
              'gripper_open_m':0.019,
              'cube_fixture_offset_link7_m':cube_fixture,
              'support_fixture_offset_link7_m':support_fixture,
              'cube_effective_offset_link7_m':cube,
              'support_effective_offset_link7_m':support,
              'cube_size_m':[0.057,0.057,0.057],
              'cube_mass_kg':0.09,
              'support_size_m':[0.075,0.040,0.010],
              'open_path_states_certified':2802,
              'gazebo_repeatability_passes_certified':3,
              'minimum_repeat_left_quality_fraction':repeat['minimum_left_quality_fraction'],
              'minimum_repeat_right_quality_fraction':repeat['minimum_right_quality_fraction'],
              'contact_quality_contract':{
                  'opposing_y_faces':True,
                  'edge_margin_m':0.001,
                  'normal_y_min':0.70,
                  'min_quality_fraction':0.80,
                  'max_contact_depth_m':0.001,
              },
              'legacy_scalar_opening_gate_authorized':False,
              'lift_authorized':False,
              'attachment_authorized':False,
          }
          Path('artifacts/rubiks_integrated_opposing_side_gate_input.json').write_text(json.dumps(gate,indent=2,sort_keys=True)+'\n')
          print(json.dumps(gate,indent=2,sort_keys=True))
          PY

      - name: Build minimal grasp-physics image
        run: |
          set -euo pipefail
          docker build -f Dockerfile.rubiks-physics -t lime-rubiks-integrated-opposing:${EXACT_HEAD_SHA} .

      - name: Run fixture-present open arm cycle and supported hold
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "$PWD/artifacts:/artifacts" \
            lime-rubiks-integrated-opposing:${EXACT_HEAD_SHA} \
            bash -lc 'bash /root/bin/run_gazebo_integrated_opposing_side_no_lift /artifacts' \
            >artifacts/container.stdout.log 2>artifacts/container.stderr.log

      - name: Validate integrated no-lift evidence
        run: |
          set -euo pipefail
          test -s artifacts/rubiks_integrated_opposing_side_anchor_setup.json
          test -s artifacts/rubiks_integrated_opposing_side_no_lift_summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('artifacts/rubiks_integrated_opposing_side_no_lift_summary.json').read_text())
          assert s['passed'] is True, s.get('errors')
          assert s['fixture_present_during_open_arm_cycle'] is True
          assert s['support_contact_before_open_cycle'] is True
          assert float(s['open_arm_cycle_support_contact_ratio']) >= 0.75
          windows=s['open_arm_motion_windows']
          assert len(windows)==2
          assert windows[0]['label']=='integrated_open_return_zero'
          assert windows[1]['label']=='integrated_open_approach_anchor'
          for window in windows:
              assert float(window['max_abs_error_rad']) <= 0.01
              assert int(window['finger_cube_contact_count'])==0
              assert int(window['nonfinger_robot_cube_contact_count'])==0
              assert abs(float(window['left_gripper_m'])-0.019)<=0.002
              assert float(window['physical_link_separation_m'])>=0.076
          movement=s['approach_fixture_movement']
          assert float(movement['horizontal_displacement_m'])<=0.003
          assert abs(float(movement['vertical_displacement_m']))<=0.002
          assert float(movement['rotation_rad'])<=0.10
          q=s['contact_quality']
          assert q['passed'] is True
          assert float(q['left']['quality_fraction'])>=0.80
          assert float(q['right']['quality_fraction'])>=0.80
          contact=s['contact_result']
          assert contact['direct_cube_frame_quality_used'] is True
          assert contact['legacy_scalar_opening_gate_used'] is False
          hold=s['hold_result']
          assert float(hold['observed_hold_seconds'])>=1.9
          assert float(hold['support_contact_ratio'])>=0.75
          assert float(hold['bilateral_finger_contact_ratio'])>=0.65
          assert float(hold['movement']['max_horizontal_displacement_m'])<=0.003
          assert float(hold['movement']['max_vertical_rise_m'])<=0.0015
          assert float(hold['movement']['max_rotation_rad'])<=0.10
          assert s['contact_cleared_after_reopen'] is True
          release=s['release_result']
          assert float(release['support_contact_ratio'])>=0.75
          assert s['lift_command_sent'] is False
          assert s['attachment_used'] is False
          assert s['base_command_sent'] is False
          assert s['physical_hardware_used'] is False
          assert s['production_runtime_modified'] is False
          assert s['grasp_success_claimed'] is False
          print(json.dumps({
              'passed':True,
              'selected_translation_link7_m':s['input']['selected_translation_link7_m'],
              'open_arm_cycle_support_ratio':s['open_arm_cycle_support_contact_ratio'],
              'approach_fixture_movement':s['approach_fixture_movement'],
              'left_quality_fraction':q['left']['quality_fraction'],
              'right_quality_fraction':q['right']['quality_fraction'],
              'hold_support_ratio':hold['support_contact_ratio'],
              'hold_bilateral_ratio':hold['bilateral_finger_contact_ratio'],
              'release_support_ratio':release['support_contact_ratio'],
              'next_phase':'RUBIK-POST-INTEGRATED-NO-LIFT-REVIEW',
          },indent=2))
          PY

      - name: Upload integrated opposing-side evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubiks-integrated-opposing-side-no-lift-evidence
          path: |
            artifacts/rubiks_integrated_opposing_side_gate_input.json
            artifacts/turtlebot3_lime_integrated_opposing_side.urdf
            artifacts/rubiks_integrated_opposing_side_anchor_setup.json
            artifacts/rubiks_integrated_opposing_side_anchor_setup.stdout.json
            artifacts/rubiks_integrated_opposing_side_anchor_setup.stderr.log
            artifacts/rubiks_integrated_opposing_side_no_lift_summary.json
            artifacts/rubiks_integrated_opposing_side_no_lift.stdout.json
            artifacts/rubiks_integrated_opposing_side_no_lift.stderr.log
            artifacts/rubiks_integrated_opposing_side.gzserver.log
            artifacts/rubiks_integrated_opposing_side.robot_state_publisher.log
            artifacts/integrated_opposing_side.robot_spawn.log
            artifacts/integrated_joint_state_broadcaster.spawner.log
            artifacts/integrated_arm_controller.spawner.log
            artifacts/integrated_gripper_controller.spawner.log
            artifacts/container.stdout.log
            artifacts/container.stderr.log
          if-no-files-found: warn
          retention-days: 30
