name: cube8-runtime-static-ci

on:
  push:
    branches:
      - work/dev2-cube8-runtime-20260826
    paths:
      - .github/workflows/cube8-runtime-static-ci.yml
      - yolo_ws/cube8_runtime_smoke.py
      - yolo_ws/cube8_hidden_pnp_smoke.py
      - yolo_ws/cube8_perception_router_smoke.py
      - yolo_ws/src/barcode_detector/barcode_detector/cube8_geometry.py
      - yolo_ws/src/barcode_detector/barcode_detector/cube8_pnp.py
      - yolo_ws/src/barcode_detector/barcode_detector/cube8_pnp_assist.py
      - yolo_ws/src/barcode_detector/barcode_detector/cube8_projective_hidden.py
      - yolo_ws/src/barcode_detector/barcode_detector/cube8_perception_router.py
      - yolo_ws/src/barcode_detector/barcode_detector/cube8_grasp.py
      - yolo_ws/src/barcode_detector/barcode_detector/cube8_transform.py

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_SAMPLE_SHA256: 48eb4331e729900ac82c630e582ca54deff6080d5ad13b11628290495e451841
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact dev2 sample
        shell: bash
        run: |
          set -euo pipefail
          test -s yolo_ws/sample.png
          actual="$(sha256sum yolo_ws/sample.png | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SAMPLE_SHA256"
          mkdir -p artifacts/dev2-sample
          cp yolo_ws/sample.png artifacts/dev2-sample/sample.png
          printf '%s\n' "$actual" > artifacts/dev2-sample/sha256.txt
      - name: Upload exact dev2 sample
        uses: actions/upload-artifact@v4
        with:
          name: dev2-sample-png-exact
          path: artifacts/dev2-sample/
          if-no-files-found: error
          retention-days: 7
      - name: Compile migrated pure runtime
        run: |
          set -euo pipefail
          python3 -m py_compile \
            yolo_ws/cube8_runtime_smoke.py \
            yolo_ws/cube8_hidden_pnp_smoke.py \
            yolo_ws/cube8_perception_router_smoke.py \
            yolo_ws/src/barcode_detector/barcode_detector/cube8_geometry.py \
            yolo_ws/src/barcode_detector/barcode_detector/cube8_pnp.py \
            yolo_ws/src/barcode_detector/barcode_detector/cube8_pnp_assist.py \
            yolo_ws/src/barcode_detector/barcode_detector/cube8_projective_hidden.py \
            yolo_ws/src/barcode_detector/barcode_detector/cube8_perception_router.py \
            yolo_ws/src/barcode_detector/barcode_detector/cube8_grasp.py \
            yolo_ws/src/barcode_detector/barcode_detector/cube8_transform.py
      - name: Run cost-aware perception router smoke
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/yolo_ws/src/barcode_detector" \
            python3 yolo_ws/cube8_perception_router_smoke.py
      - name: Install geometry smoke dependencies
        run: python3 -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: Run synthetic PnP plus grasp-frame smoke
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/yolo_ws/src/barcode_detector" \
            python3 yolo_ws/cube8_runtime_smoke.py
      - name: Run hidden-corner plus independent seven-point PnP smoke
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/yolo_ws/src/barcode_detector" \
            python3 yolo_ws/cube8_hidden_pnp_smoke.py
