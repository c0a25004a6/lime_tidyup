name: sample-cube-viz-ci

on:
  push:
    branches:
      - work/dev2-sample-viz-20260826
    paths:
      - .github/workflows/sample-cube-viz-ci.yml
      - yolo_ws/visualize_sample_cube_debug.py

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify pinned dev2 sample inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s yolo_ws/sample.png
          test -s yolo_ws/runs/pose/train-2/weights/best.pt
          test -s yolo_ws/visualize_sample_cube_debug.py
          file yolo_ws/sample.png || true
          sha256sum yolo_ws/sample.png yolo_ws/runs/pose/train-2/weights/best.pt

      - name: Install visualization runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install ultralytics pillow
          python - <<'PY'
          import torch, ultralytics, PIL
          print('torch', torch.__version__)
          print('ultralytics', ultralytics.__version__)
          print('Pillow', PIL.__version__)
          PY

      - name: Render actual sample prediction overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -f yolo_ws/sample_prediction_debug.jpg yolo_ws/sample_prediction_debug.json
          cd yolo_ws
          python visualize_sample_cube_debug.py \
            --image sample.png \
            --model runs/pose/train-2/weights/best.pt \
            --out-image sample_prediction_debug.jpg \
            --out-json sample_prediction_debug.json \
            --conf 0.25
          test -s sample_prediction_debug.jpg
          test -s sample_prediction_debug.json
          cat sample_prediction_debug.json
          file sample_prediction_debug.jpg || true
          ls -lh sample_prediction_debug.jpg sample_prediction_debug.json

      - name: Upload visualization evidence
        uses: actions/upload-artifact@v4
        with:
          name: dev2-sample-cube-viz
          path: |
            yolo_ws/sample_prediction_debug.jpg
            yolo_ws/sample_prediction_debug.json
          if-no-files-found: error
          retention-days: 7

      - name: Persist visualization on isolated work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yolo_ws/sample_prediction_debug.jpg yolo_ws/sample_prediction_debug.json
          if git diff --cached --quiet; then
            echo 'visualization already identical'
            exit 0
          fi
          git commit -m 'evidence: render dev2 sample YOLO pose'
          git push origin "HEAD:${GITHUB_REF_NAME}"
