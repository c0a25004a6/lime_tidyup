name: blame-repair-audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit-and-build-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full current history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch original LimeSimulDemo history
        shell: bash
        run: |
          set -euo pipefail
          git remote add lime-upstream https://github.com/momoiorg-repository/LimeSimulDemo.git
          git fetch --no-tags lime-upstream main

      - name: Rank ancestry, build isolated candidate and verify blame
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          ROOT=$(git rev-list --max-parents=0 origin/main | head -1)
          ROOT_TREE=$(git rev-parse "${ROOT}^{tree}")
          UPSTREAM_HEAD=$(git rev-parse refs/remotes/lime-upstream/main)
          MATCH=""
          : > upstream-ranking.tsv
          git ls-tree -r "$ROOT" | sort > root-tree-entries.txt

          # Rank all original commits by how closely their exact repository state
          # matches the collapsed local root. Prefer fewer changed paths, then more
          # byte-identical tree entries, then fewer changed text lines/binary paths.
          while read -r C; do
            TREE=$(git rev-parse "${C}^{tree}")
            PATHS=$(git diff --name-only "$C" "$ROOT" | wc -l | tr -d ' ')
            SHARED=$(comm -12 <(git ls-tree -r "$C" | sort) root-tree-entries.txt | wc -l | tr -d ' ')
            NUMSTAT=$(git diff --numstat "$C" "$ROOT")
            TEXT_LINES=$(printf '%s\n' "$NUMSTAT" | awk '$1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ {s += $1 + $2} END {print s+0}')
            BINARY=$(printf '%s\n' "$NUMSTAT" | awk '$1 == "-" || $2 == "-" {n++} END {print n+0}')
            EPOCH=$(git show -s --format='%at' "$C")
            DATE=$(git show -s --format='%aI' "$C")
            AUTHOR=$(git show -s --format='%an' "$C" | tr '\t' ' ')
            SUBJECT=$(git show -s --format='%s' "$C" | tr '\t' ' ')
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$PATHS" "$SHARED" "$TEXT_LINES" "$BINARY" "$EPOCH" "$C" "$DATE" "$AUTHOR" "$SUBJECT" >> upstream-ranking.tsv
            if [ "$TREE" = "$ROOT_TREE" ] && [ -z "$MATCH" ]; then
              MATCH="$C"
            fi
          done < <(git rev-list refs/remotes/lime-upstream/main)

          sort -t $'\t' -k1,1n -k2,2nr -k3,3n -k4,4n -k5,5nr upstream-ranking.tsv > upstream-ranking.sorted.tsv
          BEST=$(head -1 upstream-ranking.sorted.tsv | cut -f6)
          BEST_PATHS=$(head -1 upstream-ranking.sorted.tsv | cut -f1)
          BEST_SHARED=$(head -1 upstream-ranking.sorted.tsv | cut -f2)
          BEST_LINES=$(head -1 upstream-ranking.sorted.tsv | cut -f3)
          BEST_BINARY=$(head -1 upstream-ranking.sorted.tsv | cut -f4)
          BASE="${MATCH:-$BEST}"
          MODE=ranked-closest
          if [ -n "$MATCH" ]; then MODE=exact; fi

          {
            echo "current_main=$(git rev-parse origin/main)"
            echo "current_root=$ROOT"
            echo "current_root_tree=$ROOT_TREE"
            echo "upstream_head=$UPSTREAM_HEAD"
            echo "upstream_commit_count=$(git rev-list --count refs/remotes/lime-upstream/main)"
            echo "exact_tree_match=${MATCH:-none}"
            echo "ranked_base=$BASE"
            echo "ranked_changed_paths=$BEST_PATHS"
            echo "ranked_exact_shared_entries=$BEST_SHARED"
            echo "ranked_text_line_delta=$BEST_LINES"
            echo "ranked_binary_paths=$BEST_BINARY"
            echo
            echo '=== top 10 upstream ancestry candidates ==='
            echo -e 'paths\texact_shared_entries\ttext_line_delta\tbinary_paths\tepoch\tsha\tdate\tauthor\tsubject'
            head -10 upstream-ranking.sorted.tsv
            echo
            echo '=== current collapsed root ==='
            git show -s --format='sha=%H%nauthor=%an <%ae>%nauthor_date=%aI%ncommitter=%cn <%ce>%ncommitter_date=%cI%nsubject=%s' "$ROOT"
            echo
            echo '=== selected original base ==='
            git show -s --format='sha=%H%nauthor=%an <%ae>%nauthor_date=%aI%ncommitter=%cn <%ce>%ncommitter_date=%cI%nsubject=%s' "$BASE"
            echo
            echo '=== top-three pairwise evidence ==='
            mapfile -t TOP3 < <(head -3 upstream-ranking.sorted.tsv | cut -f6)
            for C in "${TOP3[@]}"; do
              echo "candidate=$C"
              git show -s --format='subject=%s' "$C"
              echo "root_diff_stat=$(git diff --shortstat "$C" "$ROOT" || true)"
            done
            if [ "${#TOP3[@]}" -ge 2 ]; then
              echo '--- differences between rank 1 and rank 2 ---'
              git diff --name-status "${TOP3[1]}" "${TOP3[0]}" | head -50
            fi
          } | tee blame-repair-audit.txt

          # Keep original upstream commits as exact Git objects on an isolated ref.
          git push origin refs/remotes/lime-upstream/main:refs/heads/history-repair/upstream-main --force

          # Recreate only the collapsed local root as a child of the selected original
          # commit, retaining its full tree and original local author/date/message.
          export GIT_AUTHOR_NAME="$(git show -s --format='%an' "$ROOT")"
          export GIT_AUTHOR_EMAIL="$(git show -s --format='%ae' "$ROOT")"
          export GIT_AUTHOR_DATE="$(git show -s --format='%aI' "$ROOT")"
          export GIT_COMMITTER_NAME="$(git show -s --format='%cn' "$ROOT")"
          export GIT_COMMITTER_EMAIL="$(git show -s --format='%ce' "$ROOT")"
          export GIT_COMMITTER_DATE="$(git show -s --format='%cI' "$ROOT")"
          git show -s --format='%B' "$ROOT" > root-message.txt
          NEW_ROOT=$(git commit-tree "$ROOT_TREE" -p "$BASE" < root-message.txt)

          git checkout -B history-repair/candidate-closest "$NEW_ROOT"
          while read -r C; do
            [ -n "$C" ] || continue
            git cherry-pick "$C"
          done < <(git rev-list --reverse "${ROOT}..origin/main")

          CURRENT_TREE=$(git rev-parse 'origin/main^{tree}')
          CANDIDATE_TREE=$(git rev-parse 'history-repair/candidate-closest^{tree}')
          if [ "$CURRENT_TREE" != "$CANDIDATE_TREE" ] || ! git diff --quiet origin/main history-repair/candidate-closest; then
            echo 'Candidate final tree differs from current main; refusing to publish.' >&2
            git diff --stat origin/main history-repair/candidate-closest >&2 || true
            exit 1
          fi

          git diff --name-only "$BASE" "$ROOT" > changed-from-base.txt
          : > blame-witnesses.txt
          while read -r P; do
            [ -n "$P" ] || continue
            if grep -Fxq "$P" changed-from-base.txt; then
              continue
            fi
            case "$P" in
              *.md|*.txt|*.py|*.cpp|*.c|*.h|*.hpp|*.xml|*.yaml|*.yml|*.json|*.sh|*.launch|*.urdf|*.xacro|Dockerfile|*/Dockerfile)
                if git cat-file -e "$BASE:$P" 2>/dev/null && git cat-file -e "$ROOT:$P" 2>/dev/null; then
                  SIZE=$(git cat-file -s "$ROOT:$P")
                  if [ "$SIZE" -gt 0 ] && [ "$SIZE" -le 200000 ]; then
                    printf '%s\n' "$P" >> blame-witnesses.txt
                  fi
                fi
                ;;
            esac
            if [ "$(wc -l < blame-witnesses.txt)" -ge 5 ]; then
              break
            fi
          done < <(git ls-tree -r --name-only "$BASE")

          WITNESS_COUNT=$(wc -l < blame-witnesses.txt | tr -d ' ')
          if [ "$WITNESS_COUNT" -eq 0 ]; then
            echo 'No unchanged text witness files were found; refusing to claim Blame restoration.' >&2
            exit 1
          fi

          : > blame-verification.txt
          RESTORED_WITNESSES=0
          while read -r P; do
            [ -n "$P" ] || continue
            CURRENT_AUTHORS=$(git blame --line-porcelain origin/main -- "$P" | sed -n 's/^author //p')
            CANDIDATE_AUTHORS=$(git blame --line-porcelain history-repair/candidate-closest -- "$P" | sed -n 's/^author //p')
            BASE_AUTHORS=$(git blame --line-porcelain "$BASE" -- "$P" | sed -n 's/^author //p')
            {
              echo "=== $P ==="
              echo '-- current main authors --'
              printf '%s\n' "$CURRENT_AUTHORS" | sort | uniq -c
              echo '-- candidate authors --'
              printf '%s\n' "$CANDIDATE_AUTHORS" | sort | uniq -c
              echo '-- upstream base authors --'
              printf '%s\n' "$BASE_AUTHORS" | sort | uniq -c
              echo
            } >> blame-verification.txt

            CURRENT_NONLOCAL=$(printf '%s\n' "$CURRENT_AUTHORS" | awk '$0 !~ /^(Yuu Akaoka|Yuu A|nekomario28)$/ && NF {n++} END {print n+0}')
            CANDIDATE_NONLOCAL=$(printf '%s\n' "$CANDIDATE_AUTHORS" | awk '$0 !~ /^(Yuu Akaoka|Yuu A|nekomario28)$/ && NF {n++} END {print n+0}')
            if [ "$CANDIDATE_NONLOCAL" -gt "$CURRENT_NONLOCAL" ]; then
              RESTORED_WITNESSES=$((RESTORED_WITNESSES + 1))
            fi
          done < blame-witnesses.txt

          if [ "$RESTORED_WITNESSES" -eq 0 ]; then
            echo 'Candidate did not improve original-author Blame on any witness; refusing to publish.' >&2
            cat blame-verification.txt >&2
            exit 1
          fi

          {
            echo
            echo '=== candidate ==='
            echo "candidate_mode=$MODE"
            echo "candidate_base=$BASE"
            echo "replacement_root=$NEW_ROOT"
            echo "candidate_head=$(git rev-parse history-repair/candidate-closest)"
            echo "candidate_final_tree=$CANDIDATE_TREE"
            echo "current_final_tree=$CURRENT_TREE"
            echo "final_tree_identical=true"
            echo "blame_witness_count=$WITNESS_COUNT"
            echo "blame_restored_witnesses=$RESTORED_WITNESSES"
            echo
            echo '=== blame witnesses ==='
            cat blame-witnesses.txt
            echo
            cat blame-verification.txt
          } | tee -a blame-repair-audit.txt

          git push origin history-repair/candidate-closest:refs/heads/history-repair/candidate-closest --force

      - name: Upload ancestry audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blame-repair-audit
          path: |
            blame-repair-audit.txt
            upstream-ranking.sorted.tsv
            blame-witnesses.txt
            blame-verification.txt
          if-no-files-found: warn
