name: cube8-runtime-ci

on:
  push:
    branches:
      - work/dev2-cube8-runtime-20260826
    paths:
      - .github/workflows/cube8-runtime-ci.yml
      - Dockerfile.yolo
      - yolo_ws/visualize_cube8_pipeline.py
      - yolo_ws/cube8_runtime_smoke.py
      - yolo_ws/cube8_sim_empty.world
      - yolo_ws/cube8_sim_roundtrip.sh
      - yolo_ws/src/barcode_detector/setup.py
      - yolo_ws/src/barcode_detector/barcode_detector/cube8_*.py

permissions:
  contents: read

jobs:
  sim-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Static sim contract checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            yolo_ws/src/barcode_detector/barcode_detector/cube8_sim_setup.py \
            yolo_ws/src/barcode_detector/barcode_detector/cube8_sim_pnp_probe.py \
            yolo_ws/src/barcode_detector/barcode_detector/cube8_sim_gazebo_bridge.py \
            yolo_ws/src/barcode_detector/barcode_detector/cube8_sim_compare.py
          python3 - <<'PY'
          import runpy
          import xml.etree.ElementTree as ET

          path = 'yolo_ws/src/barcode_detector/barcode_detector/cube8_sim_setup.py'
          mod = runpy.run_path(path)
          root = ET.fromstring(mod['build_rubiks_sdf']())
          visuals = root.findall('.//visual')
          cubies = [v for v in visuals if v.attrib['name'].startswith('cubie_')]
          stickers = [v for v in visuals if v.attrib['name'].startswith('sticker_')]
          assert mod['CUBE_SIDE_M'] == 0.057
          assert len(cubies) == 27
          assert len(stickers) == 54
          print('Cube8 sim target: 0.057 m, 27 cubies, 54 stickers')
          PY

      - name: CameraInfo to PnP to Gazebo roundtrip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p yolo_ws/cube8_sim_evidence
          docker run --rm --network host \
            -e ROS_DOMAIN_ID=82 \
            -e GAZEBO_MASTER_URI=http://127.0.0.1:11389 \
            -v "$GITHUB_WORKSPACE:/work:rw" \
            -w /work \
            osrf/ros:humble-desktop-full bash -lc '
              set -eo pipefail
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ros-humble-gazebo-ros-pkgs python3-opencv
              source /opt/ros/humble/setup.bash
              set -u
              bash /work/yolo_ws/cube8_sim_roundtrip.sh /work/yolo_ws/cube8_sim_evidence
            '

      - name: Upload Gazebo roundtrip evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cube8-sim-roundtrip-evidence
          path: yolo_ws/cube8_sim_evidence/
          if-no-files-found: warn
          retention-days: 7

  verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    env:
      EXPECTED_ONNX_SHA256: 3c04a6939c736a1730b2b0c93c66a10cf60b29e48fc545b1a0c7515aa23dacac
    steps:
      - name: Repair workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/work" ros:humble-ros-base-jammy \
            bash -lc 'chown -R "$HOST_UID:$HOST_GID" /work'

      - uses: actions/checkout@v4

      - name: Stage retained Cube8 ONNX
        shell: bash
        run: |
          set -euo pipefail
          source_onnx="$HOME/Videos/lime/cube8-rtmpose/32595602886-3-recovery-32773097860/model.onnx"
          test -s "$source_onnx"
          actual="$(sha256sum "$source_onnx" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_ONNX_SHA256"
          bytes="$(stat -c '%s' "$source_onnx")"
          echo "retained Cube8 ONNX bytes=$bytes sha256=$actual"
          test "$bytes" -lt 100000000
          mkdir -p yolo_ws/models
          cp "$source_onnx" yolo_ws/models/cube8-rtmpose-retained.onnx
          test "$(sha256sum yolo_ws/models/cube8-rtmpose-retained.onnx | awk '{print $1}')" = "$EXPECTED_ONNX_SHA256"

      - name: Static-check migrated runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            yolo_ws/visualize_cube8_pipeline.py \
            yolo_ws/cube8_runtime_smoke.py \
            yolo_ws/src/barcode_detector/barcode_detector/cube8_geometry.py \
            yolo_ws/src/barcode_detector/barcode_detector/cube8_rtmpose.py \
            yolo_ws/src/barcode_detector/barcode_detector/cube8_pnp.py \
            yolo_ws/src/barcode_detector/barcode_detector/cube8_grasp.py \
            yolo_ws/src/barcode_detector/barcode_detector/cube8_transform.py \
            yolo_ws/src/barcode_detector/barcode_detector/cube8_pose_node.py

      - name: Build Cube8 runtime image
        shell: bash
        run: |
          set -euo pipefail
          image="yolo_ros2-image_yuu:cube8-${GITHUB_SHA}"
          docker build --network host -f Dockerfile.yolo -t "$image" .
          echo "CUBE8_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Build ROS package and run synthetic PnP grasp smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e YOLO_CONFIG_DIR=/tmp/Ultralytics \
            -v "$GITHUB_WORKSPACE/yolo_ws:/root/yolo_ws:rw" \
            -w /root/yolo_ws "$CUBE8_IMAGE" bash -lc '
              source /opt/ros/humble/setup.bash
              colcon build --packages-select barcode_detector
              PYTHONPATH=/root/yolo_ws/src/barcode_detector python3 cube8_runtime_smoke.py
            '

      - name: Render actual dev2 sample with YOLO bbox plus Cube8 RTMPose
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e YOLO_CONFIG_DIR=/tmp/Ultralytics \
            -v "$GITHUB_WORKSPACE/yolo_ws:/root/yolo_ws:rw" \
            -w /root/yolo_ws "$CUBE8_IMAGE" \
            python3 visualize_cube8_pipeline.py \
              --image sample.png \
              --detector runs/pose/train-2/weights/best.pt \
              --rtmpose models/cube8-rtmpose-retained.onnx \
              --output-image sample_cube8_debug.jpg \
              --output-json sample_cube8_debug.json \
              --conf 0.25
          test -s yolo_ws/sample_cube8_debug.jpg
          test -s yolo_ws/sample_cube8_debug.json
          python3 - <<'PY'
          import json
          doc=json.load(open("yolo_ws/sample_cube8_debug.json"))
          assert len(doc["rtmpose"]["keypoints"]) == 8
          assert doc["pipeline"] == "yolo_bbox+cube8_rtmpose"
          assert doc["grasp"]["execution_authorized"] is False
          print(json.dumps(doc,indent=2))
          PY

      - name: Upload exact runtime model and sample visualization
        uses: actions/upload-artifact@v4
        with:
          name: dev2-cube8-runtime-bundle
          path: |
            yolo_ws/models/cube8-rtmpose-retained.onnx
            yolo_ws/sample_cube8_debug.jpg
            yolo_ws/sample_cube8_debug.json
          if-no-files-found: error
          retention-days: 7
